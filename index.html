  <!-- 연결 설정(site.config.js) 적용 + 편집기에서 저장한 설정(Firestore site/config) 불러오기 -->
  <script>
  (function () {
    var S = (typeof SITE !== "undefined") ? SITE : null;
    if (!S) return;
    var KEY = 'site-override-v1';
    var C = window.SITE_CONFIG || {};
    var cfg = (C.firebase && C.firebase.apiKey) ? C.firebase : null;
    window.SITE_FB = cfg;
    var SKIP = { firebase: 1, admin: 1, firebaseSdk: 1 };

    /* 연결 정보는 항상 site.config.js 값을 써요 (저장된 설정이 덮어쓰지 못하게 마지막에 다시 적용) */
    function applyConfig() {
      S.admin = { email: (C.admin && C.admin.email) || '' };
      if (!cfg) return;
      S.firebase = { config: cfg };
      S.guest = S.guest || {};
      var g = S.guest;
      var formLink = g.form && g.form.formLink;
      if ((!g.mode || g.mode === 'form') && !formLink) g.mode = 'firebase';
      g.firebase = g.firebase || {};
      g.firebase.config = cfg;
      if (!g.firebase.collection) g.firebase.collection = 'guests';
    }

    /* 편집기 미리보기(iframe) : 부모 편집기에서 편집 중인 값을 그대로 보여줘요 */
    if (window.parent !== window && /[?&]preview=1/.test(location.search)) {
      try {
        var pd = window.parent.OHAdmin && window.parent.OHAdmin._state.draft;
        if (pd) Object.keys(pd).forEach(function (k) { if (!SKIP[k]) S[k] = JSON.parse(JSON.stringify(pd[k])); });
      } catch (e) {}
      applyConfig();
      return;
    }

    var cached = null;
    try { cached = JSON.parse(localStorage.getItem(KEY) || 'null'); } catch (e) {}
    if (cached && cached.data) Object.keys(cached.data).forEach(function (k) { if (!SKIP[k]) S[k] = cached.data[k]; });
    applyConfig();
    if (!cfg || S.remote === false) return;

    var BASE = 'https://www.gstatic.com/firebasejs/' + (S.firebaseSdk || '13.0.0') + '/';
    function reloadOnce(rev) {
      try { if (sessionStorage.getItem('site-reloaded') === String(rev)) return; sessionStorage.setItem('site-reloaded', String(rev)); } catch (e) {}
      location.reload();
    }
    window.addEventListener('load', function () {
      setTimeout(function () {
        Promise.all([import(BASE + 'firebase-app.js'), import(BASE + 'firebase-firestore.js')]).then(function (m) {
          var app = m[0].getApps().length ? m[0].getApps()[0] : m[0].initializeApp(cfg);
          return m[1].getDoc(m[1].doc(m[1].getFirestore(app), 'site', 'config'));
        }).then(function (snap) {
          var have = cached ? cached.rev : 0;
          if (!snap.exists()) { if (cached) { try { localStorage.removeItem(KEY); } catch (e) {} reloadOnce('reset'); } return; }
          var v = snap.data();
          if (v.rev === have) return;
          var data = JSON.parse(v.json);
          try { localStorage.setItem(KEY, JSON.stringify({ rev: v.rev, data: data })); } catch (e) {}
          reloadOnce(v.rev);
        }).catch(function () {});
      }, 300);
    });
  })();
  </script>

  <script>
    (function () {
      const S = (typeof SITE !== "undefined") ? SITE : {};
      const C = S.colors || {};
      const F = S.fonts || {};
      const root = document.documentElement.style;
            const BGM = window.BGM || { page: function () {}, item: function () {}, reset: function () {} };

      /* =====================================================
         공통 설정 (메인홈과 동일: 색상 · 배경 · 글꼴)
         ===================================================== */

      /* ----- 대표 색 → 사이트 전체 색 자동 계산 ----- */
      function hexRGB(h) {
        h = String(h || "").trim().replace("#", "");
        if (h.length === 3) h = h.replace(/./g, "$&$&");
        const n = parseInt(h, 16);
        return isNaN(n) || h.length !== 6 ? [34, 34, 34] : [n >> 16 & 255, n >> 8 & 255, n & 255];
      }
      function toHex(c) { return "#" + c.map(function (v) { return ("0" + Math.round(v).toString(16)).slice(-2); }).join(""); }
      // a 색과 b 색을 t 비율로 섞기 (t = 0 → a, 1 → b)
      function mix(a, b, t) {
        const x = hexRGB(a), y = hexRGB(b);
        return toHex([0, 1, 2].map(function (i) { return x[i] + (y[i] - x[i]) * t; }));
      }
      // 밝은 색인지 (0 어두움 ~ 1 밝음)
      function light(h) { const c = hexRGB(h); return (c[0] * 299 + c[1] * 587 + c[2] * 114) / 255000; }
      // 그 색 위에 올릴 글자색 (흰색 / 검은색)
      function onColor(h) { return light(h) > 0.6 ? "#111111" : "#ffffff"; }

      // 회색 계열(채도 낮음)인지
      function gray(h) { const c = hexRGB(h); return Math.max.apply(null, c) - Math.min.apply(null, c) < 24; }

      const THEME = S.themeColor || "#222222";
      const INK = light(THEME) > 0.55 ? mix(THEME, "#000000", 0.65) : THEME;   // 글자용 진한 색
      const ON = onColor(THEME);
      const AUTO = {
        background: gray(THEME) ? "#ffffff" : mix(THEME, "#ffffff", 0.95),   // 무채색이면 흰 바탕
        title: INK,
        subText: mix(INK, "#ffffff", 0.2),
        menuBar: THEME,
        menuText: ON,
        menuDesc: mix(ON, THEME, 0.4),
        accent: ON === "#ffffff" ? "#ffffff" : INK,
        accentText: ON === "#ffffff" ? THEME : "#ffffff",
        icon: mix(ON, THEME, 0.55),
        dots: INK,
        deco: INK
      };
      const COL = {};
      Object.keys(AUTO).forEach(function (k) { COL[k] = C[k] || AUTO[k]; });   // 직접 적은 색이 있으면 그걸 써요

      const colorMap = {
        "--bg": COL.background, "--title": COL.title, "--sub-text": COL.subText,
        "--menu-bar": COL.menuBar, "--menu-text": COL.menuText, "--menu-desc": COL.menuDesc,
        "--accent": COL.accent, "--accent-text": COL.accentText, "--icon": COL.icon,
        "--dots": COL.dots, "--deco": COL.deco
      };
      for (const k in colorMap) if (colorMap[k]) root.setProperty(k, colorMap[k]);
      root.setProperty("--btn", COL.menuBar);       // 버튼 · 칩 색
      root.setProperty("--btn-text", COL.menuText);

      // 캐릭터 · 오너 카드: 색을 비워두면 대표 색을 써요
      // SD 크기: 캐릭터에 적은 sdSize → 없으면 characterPage.sdSize → 기본 230
      const sdW = function (o) {
        const v = (o && o.sdSize) || (S.characterPage || {}).sdSize || 230;
        return /^\d+$/.test(String(v)) ? v + "px" : v;
      };
      const cardColor = function (c) { return c || THEME; };
      const cardSub = function (c, main) { return c || mix(main || THEME, "#ffffff", 0.45); };
      const cardText = function (c, main) { return c || onColor(main || THEME); };

      const B = S.background || {};
      if (B.image) {
        const photo = document.getElementById("bgPhoto");
        photo.style.backgroundImage = "url('" + B.image + "')";
        photo.style.backgroundPosition = B.position || "center";
        if (B.width != null && B.width !== "") {
          photo.style.backgroundSize = (typeof B.width === "number" ? B.width + "px" : B.width) + " auto";
        }
        if (B.blur) {
          photo.style.filter = "blur(" + B.blur + "px)";
          photo.style.inset = "-" + (B.blur * 3) + "px";
        }
        photo.style.display = "block";
        if (B.overlay) {
          const ov = document.getElementById("bgOverlay");
          ov.style.backgroundColor = B.overlayColor || COL.background;
          ov.style.opacity = (B.overlayStrength != null) ? B.overlayStrength : 0.5;
          ov.style.display = "block";
        }
      }
      if (B.grid) {
        const gd = document.getElementById("bgGrid");
        gd.style.setProperty("--grid-color", B.gridColor || INK);
        gd.style.setProperty("--grid-size", (B.gridSize || 46) + "px");
        gd.style.setProperty("--grid-line", (B.gridLine || 2) + "px");
        gd.style.opacity = (B.gridStrength != null) ? B.gridStrength : 1;
        gd.style.display = "block";
      }
      if (B.frontImage) {                     // 격자무늬 위에 올라오는 이미지
        const fr = document.getElementById("bgFront");
        fr.style.backgroundImage = "url('" + B.frontImage + "')";
        fr.style.backgroundPosition = B.frontPosition || "center";
        if (B.frontWidth != null && B.frontWidth !== "") {
          fr.style.backgroundSize = (typeof B.frontWidth === "number" ? B.frontWidth + "px" : B.frontWidth) + " auto";
        }
        fr.style.opacity = (B.frontOpacity != null && B.frontOpacity !== "") ? B.frontOpacity : 1;
        fr.style.display = "block";
      }
      if (B.fade) {
        const fd = document.getElementById("bgFade");
        fd.style.setProperty("--fade-color", B.fadeColor || COL.background);
        fd.style.height = (B.fadeHeight || 45) + "%";
        fd.style.opacity = (B.fadeStrength != null) ? B.fadeStrength : 0.9;
        fd.style.display = "block";
      }

      function loadFont(name, weight) {
        if (!name) return;
        const link = document.createElement("link");
        link.rel = "stylesheet";
        link.href = "https://fonts.googleapis.com/css2?family=" +
          name.trim().replace(/ /g, "+") + (weight ? ":wght@" + weight : "") + "&display=swap";
        document.head.appendChild(link);
      }
      loadFont(F.title);
      if (F.titleWeight) loadFont(F.title, F.titleWeight);
      loadFont(F.menu);
      loadFont(F.body);
      loadFont(F.body, "400;700;900");
      loadFont(F.mono);
      loadFont(F.mono, "400;700");
      loadFont(F.sign || "Caveat", "700");
      loadFont(F.hand || "Nanum Pen Script");
      loadFont(F.MU, "400;700;900");
      if (F.titleWeight) root.setProperty("--title-weight", F.titleWeight);
      root.setProperty("--font-title", "'" + (F.title || "serif") + "'");
      root.setProperty("--font-menu", "'" + (F.menu || "sans-serif") + "'");
      root.setProperty("--font-body", "'" + (F.body || "sans-serif") + "'");
      root.setProperty("--font-mono", "'" + (F.mono || "monospace") + "'");
      root.setProperty("--font-sign", "'" + (F.sign || "Caveat") + "'");
      root.setProperty("--font-hand", "'" + (F.hand || "Nanum Pen Script") + "'");
      root.setProperty("--font-jet", "'" + (F.jet || "monospace") + "'");
      root.setProperty("--font-mu", "'" + (F.MU || "sans-serif") + "'");

      /* =====================================================
         페이지 이동 (주소 뒤 #이름)
         ===================================================== */
      const ROUTES = ["home", "character", "floormaster", "other", "pair", "owner", "guest"];
const TITLES = { home: "", character: "Character", floormaster: "Floormaster", other: "Other", pair: "Pair", owner: "Owner", guest: "Guest" };

      // "character.html" 처럼 적힌 링크도 "#character" 로 바꿔줘요
      function routeLink(l) {
        const m = /^(?:\.\/)?([a-z]+)\.html$/i.exec(String(l || ""));
        if (m) {
          const r = m[1].toLowerCase() === "index" ? "home" : m[1].toLowerCase();
          if (ROUTES.indexOf(r) > -1) return r === "home" ? "#" : "#" + r;
        }
        return l || "#";
      }

      // 키보드 단축키는 지금 페이지 것만 작동하게
      let keyHandlers = [];
      function addKey(fn) { keyHandlers.push(fn); }
      document.addEventListener("keydown", function (e) {
        keyHandlers.forEach(function (fn) { fn(e); });
      });

      function barcode(seed) {
        let h = 0;
        const str = String(seed || "0");
        for (let i = 0; i < str.length; i++) h = (h * 31 + str.charCodeAt(i)) >>> 0;
        let bars = "";
        for (let i = 0; i < 46; i++) {

      function digits(seed, n) {
        let h = 7;

        for (let i = 0; i < str.length; i++) h = (h * 131 + str.charCodeAt(i)) >>> 0;
        let out = "";
        for (let i = 0; i < n; i++) { h = (h * 1103515245 + 12345) >>> 0; out += (h >>> 16) % 10; }
        return out;

      // 번호에 따라 늘 같은 QR 모양 (장식용)
      function qr(seed) {
        const N = 21;

        const str = String(seed || "0");
        for (let i = 0; i < str.length; i++) h = (h * 33 + str.charCodeAt(i)) >>> 0;
        let r = "";
        const finder = function (x, y) {

                 '<rect x="' + (x + 1) + '" y="' + (y + 1) + '" width="5" height="5" fill="var(--paper)"/>' +
                 '<rect x="' + (x + 2) + '" y="' + (y + 2) + '" width="3" height="3"/>';
        };
        for (let y = 0; y < N; y++) for (let x = 0; x < N; x++) {
          const inF = (x < 8 && y < 8) || (x > 12 && y < 8) || (x < 8 && y > 12);
          if (inF) continue;
          h = (h * 1103515245 + 12345) >>> 0;
          if ((h >>> 16) % 2) r += '<rect x="' + x + '" y="' + y + '" width="1" height="1"/>';
        }
        return '<svg class="wt-qr" viewBox="0 0 21 21" shape-rendering="crispEdges">' +

      }
      function bodiesOf(ch) { return outfitEntries(ch).map(function (e) { return e.src; }); }
      // 지금 입고 있는 의상의 이름 ("의상명으로 이름 변경" 이 켜져 있고 이름이 있을 때만)
      function wornName(ch) {
        const e = outfitEntries(ch)[bodyIdx(ch)];
        return (e && e.use && e.name) ? e.name : "";
      }
      // 영문 이름: 의상 이름이 켜져 있고 의상 영문 이름이 있을 때만 바뀌어요 (없으면 원래 영문 이름)
      function wornNameEn(ch) {
        const e = outfitEntries(ch)[bodyIdx(ch)];
        return (e && e.use && e.en) ? e.en : "";
      }
      function cardNameEn(ch) { return wornNameEn(ch) || (ch && ch.nameEn) || ""; }
      function shownDetailNameEn(ch) { return wornNameEn(ch) || detailNameEn(ch); }
      function cardName(ch) { return wornName(ch) || (ch && ch.name) || ""; }              // 카드 · 타일
      function shownDetailName(ch) { return wornName(ch) || detailName(ch); }              // 상세 프로필
      function bodyIdx(ch) {
        const n = bodiesOf(ch).length;
        const v = outfitSel[PAGE + ":" + list.indexOf(ch)] || 0;
        return v < n ? v : 0;
      }
      function curBody(ch) { const b = bodiesOf(ch); return b.length ? b[bodyIdx(ch)] : ""; }
      function curSd(ch) {   // 지금 입은 의상의 SD (없으면 캐릭터 기본 SD)
        const e = outfitEntries(ch)[bodyIdx(ch)];
        return (e && e.sd) || (ch && ch.sd) || "";
      }

      // 설정 글: 카드 보기일 때는 전신 일러스트를 글 옆에 2단으로 같이 보여줘요
      function storyBlock(ch) {
        if (modeOf(ch) === "card" && curBody(ch)) {
          const tmp = document.createElement("div");
          tmp.innerHTML = ch.story || "";
          const toggles = [];
          tmp.querySelectorAll("details.tg").forEach(function (d) {
            if (d.parentElement && d.parentElement.closest("details.tg")) return;   // 토글 안의 토글은 건너뜀
            toggles.push(d.outerHTML);
            d.remove();
          });
          return '<div class="dt-story dt-story-art"><div>' + tmp.innerHTML + '</div>' +
                 '<img src="' + curBody(ch) + '" alt="' + String(ch.name || "").replace(/"/g, "&quot;") + '" draggable="false"></div>' +
                 (toggles.length ? '<div class="dt-story dt-story-tg">' + toggles.join("") + '</div>' : "");
        }
        return ch.story ? '<div class="dt-story">' + ch.story + '</div>' : "";
      }

      /* ---------- 가명 → 본명 뒤섞기 효과 ---------- */
      let morphJobs = [], morphTimer = 0, morphDelay = 0;
      const SCR_POOL = "■⁕※¿?%‽^$៛₣₶৹▦▨◊▪◇◌◍◎#@%&*";
      const plainText = function (html) { const d = document.createElement("div"); d.innerHTML = html; return d.textContent || ""; };
      function stopMorph() { clearInterval(morphTimer); morphTimer = 0; }
      function resetMorph() {                       // 가명으로 되돌리기
        stopMorph();
        morphJobs.forEach(function (j) { if (j.el.isConnected) j.el.innerHTML = j.from; });
      }
      function runMorph() {
        stopMorph();
        const jobs = morphJobs.filter(function (j) { return j.el.isConnected; });
        if (!jobs.length) return;
        const t0 = Date.now(), DUR = 1000;
        jobs.forEach(function (j) {
          j.fa = plainText(j.from);
          j.ta = plainText(j.to);
          const len = Math.max(j.fa.length, j.ta.length, 1);
          j.thr = [];
          for (let i = 0; i < len; i++) j.thr.push(i / len * 0.55 + Math.random() * 0.45);   // 글자마다 확정되는 시점이 제각각
        });
        morphTimer = setInterval(function () {
          const p = Math.min(1, (Date.now() - t0) / DUR);
          jobs.forEach(function (j) {
            if (p >= 1) { j.el.innerHTML = j.to; return; }   // 마지막엔 원본(링크 등 포함)으로
            const L = Math.round(j.fa.length + (j.ta.length - j.fa.length) * p);
            let s = "";
            for (let i = 0; i < L; i++) {
              const c = j.ta[i];
              if (c !== undefined && p >= j.thr[i]) s += c;
              else if (c === " ") s += " ";
              else s += SCR_POOL.charAt(Math.floor(Math.random() * SCR_POOL.length));
            }
            j.el.textContent = s;
          });
          if (p >= 1) stopMorph();
        }, 45);
      }

      /* ---------- 스테이터스 (육각 ↔ 막대) ---------- */
      function statsData(ch) {
        const s = (ch && ch.stats) || {};
        const v = function (x) { x = Math.round(+x); return isNaN(x) ? 1 : Math.max(1, Math.min(20, x)); };
        const fn = String(s.stFreeName || "").trim();
        const fd = String(s.stFreeDesc || "").trim();
        return {
          use: s.stUse === true,
          items: [
            { k: "신체", v: v(s.stBody) }, { k: "지능", v: v(s.stIntel) }, { k: "언변", v: v(s.stSpeech) },
            { k: "정신력", v: v(s.stMind) }, { k: "신뢰도", v: v(s.stTrust) }
          ],
          free: { k: fn ? plainName(fn) : "자유", v: v(s.stFreeValue), d: fd, has: !!(fn || fd) }
        };
      }

      function hexSVG(items) {
        const cx = 160, cy = 120, R = 78;
        const pt = function (i, r) { const a = (-90 + i * 60) * Math.PI / 180; return [cx + r * Math.cos(a), cy + r * Math.sin(a)]; };
        const f = function (p) { return p[0].toFixed(1) + "," + p[1].toFixed(1); };
        let g = "";
        (document.body.getAttribute("data-chview") === "card" ? [4, 8, 12, 16, 20] : [5, 10, 15, 20]).forEach(function (l) {
          g += '<polygon class="stt-ring' + (l === 20 ? ' out' : '') + '" points="' + items.map(function (_, i) { return f(pt(i, R * l / 20)); }).join(" ") + '"/>';
        });
        items.forEach(function (_, i) {
          const p = pt(i, R);
          g += '<line class="stt-axis" x1="' + cx + '" y1="' + cy + '" x2="' + p[0].toFixed(1) + '" y2="' + p[1].toFixed(1) + '"/>';
        });
        const poly = items.map(function (it, i) { return f(pt(i, R * it.v / 20)); }).join(" ");
        const dots = items.map(function (it, i) {
          const p = pt(i, R * it.v / 20);
          return '<circle class="stt-dot" cx="' + p[0].toFixed(1) + '" cy="' + p[1].toFixed(1) + '" r="1.3"/>';
        }).join("");
        const labels = items.map(function (it, i) {
          const a = (-90 + i * 60) * Math.PI / 180, c = Math.cos(a);
          const p = pt(i, R + 5);
          const anchor = c > 0.3 ? "start" : c < -0.3 ? "end" : "middle";
          const dy = i === 0 ? "-0.2em" : i === 3 ? "0.85em" : "0.35em";
          const name = it.k.length > 7 ? it.k.slice(0, 7) + "…" : it.k;
          return '<text class="stt-lab" x="' + p[0].toFixed(1) + '" y="' + p[1].toFixed(1) + '" dy="' + dy + '" text-anchor="' + anchor + '">' + name + '</text>';
        }).join("");
        return '<svg class="stt-svg" viewBox="0 0 260 180" role="img" aria-label="스테이터스 육각 그래프">' +
          '<g class="stt-frame">' + g + '</g>' +
          '<g class="stt-data"><polygon class="stt-poly" points="' + poly + '"/>' + dots + '</g>' +
          '<g class="stt-lab-g">' + labels + '</g></svg>';
      }

      function statsBlock(ch, re) {
        const d = statsData(ch);
        if (!d.use) return "";
        const bar = statView === "bar";
        let body;
        if (!bar) {
          body = '<div class="stt-chart">' + hexSVG(d.items.concat([{ k: d.free.k, v: d.free.v }])) + '</div>';
        } else {
          body = '<ul class="stt-bars">' + d.items.map(function (it, n) {
            return '<li style="--n:' + n + '"><span class="stt-k">' + it.k + '</span>' +
              '<span class="stt-track"><i style="width:' + (it.v / 20 * 100) + '%"></i></span><b>' + it.v + '</b></li>';
          }).join("") + '</ul>' +
          (d.free.has
            ? '<div class="stt-skill"><p class="stt-skill-n">' + d.free.k + '</p>' +
              (d.free.d ? '<div class="stt-skill-d">' + d.free.d + '</div>' : "") + '</div>'
            : "");
        }
        return '<section class="stt' + (re ? " re" : "") + '" role="button" tabindex="0" aria-label="스테이터스 (누르면 육각/막대 전환)">' + body + '</section>';
      }

      function bindStats(ch) {
        const el = statBox.querySelector(".stt");
        if (!el) return;
        const toggle = function () {
          statView = statView === "hex" ? "bar" : "hex";
          el.outerHTML = statsBlock(ch, true);
          bindStats(ch);
        };
        el.addEventListener("click", toggle);
        el.addEventListener("keydown", function (e) {
          if (e.key === "Enter") { e.preventDefault(); e.stopPropagation(); toggle(); }
        });
      }

      function renderDetail(ch, i) {
        const color = cardColor(ch.color);
        detail.style.setProperty("--c", color);
        detail.style.setProperty("--ct", ch.textColor || "");
        document.getElementById("chDetailBg").style.setProperty("--c", color);

        /* --- PROFILE --- */
        const rows = (ch.profile || []).map(function (r) {
          return '<div class="dt-row"><dt>' + (r.label || "") + '</dt><dd>' + (r.value || "") + '</dd></div>';
        }).join("");
        const paneProfile =
          (ch.intro ? '<p class="dt-intro">' + ch.intro + '</p>' : "") +
          (rows ? '<dl class="dt-list">' + rows + '</dl>' : "") +
          (ch.quote ? '<blockquote class="dt-quote">' + ch.quote + '</blockquote>' : "") +
          storyBlock(ch) +
          ((ch.tags || []).length ? '<div class="cd-tags dt-tags">' + tags(ch) + '</div>' : "");

        /* --- GALLERY --- */
        const gal = ch.gallery || [];
        const paneGallery = gal.length
          ? '<div class="dt-gallery">' + gal.map(function (g, n) {
              return '<button class="dt-shot' + (g.image ? "" : " empty") + '" data-n="' + n + '">' +
                (g.image ? '<img src="' + g.image + '" alt="">' : '<span>' + num2(n + 1) + '</span>') +
                (g.caption ? '<em>' + g.caption + '</em>' : "") +
              '</button>';
            }).join("") + '</div>'
          : '<p class="dt-empty">' + (P.galleryEmpty || "아직 등록된 이미지가 없어요.") + '</p>';

        /* --- RELATION --- */
        const rel = ch.relations || [];
        const paneRelation = rel.length
          ? '<ul class="dt-rel">' + rel.map(function (r) {
              const tg = r.link ? chRef(r.link) : null;
              const linked = tg && tg.ch;
              const img = r.image || (linked ? (linked.tile || linked.image) : "");
              const rc = linked ? cardColor(linked.color) : color;
              return '<li class="dt-rel-item' + (linked ? " linked" : "") + '"' + (linked ? ' data-link="' + r.link + '"' : "") + ' style="--rc:' + rc + '">' +
                '<span class="dt-rel-ava">' + (img ? '<img src="' + img + '" alt="">' : '<b>' + String(r.name || "?").charAt(0) + '</b>') + '</span>' +
                '<div class="dt-rel-body">' +
                  '<p class="dt-rel-head"><strong>' + (r.name || "") + '</strong>' + (r.label ? '<span>' + r.label + '</span>' : "") + '</p>' +
                  (r.text ? '<p class="dt-rel-text">' + r.text + '</p>' : "") +
                '</div>' +
                (linked ? '<span class="dt-rel-go">VIEW<i></i></span>' : "") +
              '</li>';
            }).join("") + '</ul>'
          : '<p class="dt-empty">' + (P.relationEmpty || "아직 등록된 관계가 없어요.") + '</p>';

        detail.innerHTML =
          '<header class="dt-head">' +
            '<div class="dt-top">' +
              '<nav class="dt-tabs">' +
                '<button class="on" data-tab="profile">' + TABS.profile + '</button>' +
                '<button data-tab="gallery">' + TABS.gallery + '</button>' +
                '<button data-tab="relation">' + TABS.relation + '</button>' +
              '</nav>' +
              '<span>No. ' + num2(i + 1 + OFFSET) + '</span>' +
            '</div>' +
            '<h2 class="dt-name">' + shownDetailName(ch) + '</h2>' +
            '<p class="dt-en">' + shownDetailNameEn(ch) + '</p>' +
          '</header>' +
          '<div class="dt-panes">' +
            '<section class="dt-pane on" data-pane="profile">' + paneProfile + '</section>' +
            '<section class="dt-pane" data-pane="gallery">' + paneGallery + '</section>' +
            '<section class="dt-pane" data-pane="relation">' + paneRelation + '</section>' +
          '</div>';


        // 본명 표시 캐릭터: 상세가 열릴 때 가명 → 본명으로 바뀌어요
        stopMorph();
        morphJobs = [];
        if (!document.body.classList.contains("is-flipped")) {   // 이미 열려 있는 상태에서 다시 그릴 땐 바로 본명
          [[".dt-name", wornName(ch) || ch.name, shownDetailName(ch)], [".dt-en", wornNameEn(ch) || ch.nameEn, shownDetailNameEn(ch)]].forEach(function (a) {
            const el = detail.querySelector(a[0]), from = a[1] || "", to = a[2] || "";
            if (el && from !== to) { el.innerHTML = from; morphJobs.push({ el: el, from: from, to: to }); }
          });
        }

        // 탭 전환
        detail.querySelectorAll(".dt-tabs button").forEach(function (btn) {
          btn.addEventListener("click", function () {
            const t = btn.getAttribute("data-tab");
            detail.querySelectorAll(".dt-tabs button").forEach(function (b) { b.classList.toggle("on", b === btn); });
            detail.querySelectorAll(".dt-pane").forEach(function (p) { p.classList.toggle("on", p.getAttribute("data-pane") === t); });
            detail.querySelector(".dt-panes").scrollTop = 0;
          });
        });
        // 갤러리 크게 보기
        detail.querySelectorAll(".dt-shot").forEach(function (b) {
          b.addEventListener("click", function () { openBox(gal, +b.getAttribute("data-n")); });
        });
        // 설정 글 옆 전신 일러스트: 누르면 크게 보기
        const art = detail.querySelector(".dt-story-art > img");
        if (art) art.addEventListener("click", function () {
          openBox([{ image: curBody(ch), caption: cardName(ch) }], 0);
        });
        // 관계: 연결된 캐릭터로 이동
        detail.querySelectorAll(".dt-rel-item.linked").forEach(function (li) {
          li.addEventListener("click", function (e) {
            if (e.target.closest(".ch-link, a, .spoil, .fn")) return;   // 글 속 링크 · 스포일러 · 각주를 눌렀을 땐 그쪽이 처리
            openChar(li.getAttribute("data-link"));
          });
        });
        // 글 속 캐릭터 링크 : <a class="ch-link" data-ch="2">글</a>  (관계 탭 링크와 같은 방식으로 이동)
        detail.querySelectorAll(".ch-link[data-ch]").forEach(function (a) {
          a.setAttribute("tabindex", "0");
          a.setAttribute("role", "link");
          const run = function (e) { e.preventDefault(); e.stopPropagation(); openChar(a.getAttribute("data-ch")); };
          a.addEventListener("click", run);
          a.addEventListener("keydown", function (e) { if (e.key === "Enter") run(e); });
        });
      }

      // 캐릭터 번호(1, 2… / F1… / O1…)로 이동해서 상세 프로필을 열어요
      function openChar(ref) {
        const tg = chRef(String(ref == null ? "" : ref).trim());
        if (!tg) return;
        if (tg.page === PAGE) {
          enter(tg.idx, function () { setTimeout(function () { flip(true); }, 350); });
        } else {
          CH_START = { i: tg.idx, flip: true };
          location.hash = "#" + tg.page;
        }
      }

      /* ----- 갤러리 크게 보기 (라이트박스) ----- */
      const box = document.getElementById("chBox");
      let boxList = [], boxN = 0;
      function showBox() {
        const g = boxList[boxN] || {};
        box.classList.toggle("single", boxList.length < 2);
        box.querySelector(".box-img").innerHTML = g.image ? '<img src="' + g.image + '" alt="">' : '<span class="box-empty">NO IMAGE</span>';
        box.querySelector(".box-cap").innerHTML = (g.caption || "") + '<small>' + num2(boxN + 1) + ' / ' + num2(boxList.length) + '</small>';
      }
      function openBox(arr, n) { boxList = arr; boxN = n; showBox(); box.classList.add("open"); }
      function closeBox() { box.classList.remove("open"); }
      function moveBox(d) { if (!boxList.length) return; boxN = (boxN + d + boxList.length) % boxList.length; showBox(); }
      box.addEventListener("click", function (e) { if (e.target === box || e.target.classList.contains("box-close")) closeBox(); });
      box.querySelector(".box-prev").addEventListener("click", function () { moveBox(-1); });
      box.querySelector(".box-next").addEventListener("click", function () { moveBox(1); });

      /* =====================================================
         카드 그리기 · 선택 · 뒤집기
         ===================================================== */
      const holder = document.getElementById("chHolder");
      const tilesBox = document.getElementById("chTilesIn");
      const statBox = document.getElementById("chStat");
      // 전신 모드: 일러스트 왼쪽 ~ 화면 왼쪽 여백 사이의 빈 공간 가운데에 놓아요 (창 크기에 따라 자동)
      function placeStat() {
        if (document.body.getAttribute("data-chview") !== "full") { statBox.style.left = ""; return; }
        const img = holder.querySelector(".fb-img");
        if (!img) return;
        // 상세 프로필이 열렸을 때의 무대(왼쪽 40px ~ 46vw) 가운데에 전신 이미지가 서요 → 그 왼쪽 끝에 맞춰 따라가요
        const L = 40, stageR = window.innerWidth * 0.46;
        let w = img.offsetWidth;
        if (img.naturalWidth && img.naturalHeight) {
          const hh = Math.min(img.naturalHeight, window.innerHeight - 170);
          w = Math.min(img.naturalWidth * hh / img.naturalHeight, stageR - L);
        }
        if (!w) return;
        const imgLeft = (L + stageR) / 2 - w * 0.95 / 2;     // 열렸을 땐 살짝(95%) 줄어들어 있어요
        const overlap = 24;                                    // 전신 이미지와 아주 살짝 겹치게
        statBox.style.left = Math.max(12, imgLeft - statBox.offsetWidth + overlap) + "px";
      }
      function renderStat(ch) {
        const html = statsBlock(ch);
        statBox.style.setProperty("--c", cardColor(ch.color));
        statBox.innerHTML = html;
        document.body.classList.toggle("stat-on", !!html);
        bindStats(ch);
      }
      const count = document.getElementById("chCount");
      let current = 0;

      // 뒤집기: true = 뒷면, false = 앞면, 비우면 반대로
      function flip(on) {
        const f = document.getElementById("cdFlip");
        if (!f) return;
        const was = f.classList.contains("flipped");
        const next = (on === undefined) ? !was : on;
        f.classList.toggle("flipped", next);
        document.body.classList.toggle("is-flipped", next);
        if (!next) closeWd();
        if (next !== was) {
          clearTimeout(morphDelay);
          if (next) morphDelay = setTimeout(runMorph, 550);
          else morphDelay = setTimeout(resetMorph, 700);
        }
        if (!FM && !OT) { const c = list[current]; BGM.item(next && c ? c.bgm : "", c && c.bgmTitle); }
        if (f.classList.contains("fb-flip") && next !== was) {
          f.classList.remove("spin"); void f.offsetWidth; f.classList.add("spin");
        }
      }

      /* ---------- 카드 ↔ 전신 일러스트 전환 ---------- */
      let view = "card";            // 지금 보기: "card" | "full"
      let spinning = false;
      const viewBox = document.getElementById("chView");
      viewBox.innerHTML = '<span class="vw-thumb"></span><span class="vw-l">CARD</span><span class="vw-l">FULL</span>';

      // 전신 일러스트가 있는 캐릭터만 전신 보기가 돼요 (없으면 카드로 보여요)
      function modeOf(ch) { return (view === "full" && ch && curBody(ch)) ? "full" : "card"; }

      function syncView(ch) {
        const full = modeOf(ch) === "full";
        viewBox.classList.toggle("is-full", full);
        viewBox.setAttribute("aria-checked", full ? "true" : "false");
        viewBox.disabled = !(ch && curBody(ch));
        viewBox.title = viewBox.disabled ? "전신 일러스트가 없어요" : "카드 ↔ 전신 전환";
      }

      // SD: 회전하는 카드 밖에서 따로 그려요 (전환 때 같이 돌지 않게)
      function drawSd(ch, mode) {
        const old = holder.querySelector(".sd-fx");
        if (old) old.remove();
        const sdSrc = curSd(ch);
        if (!sdSrc) return;
        const el = document.createElement("img");
        el.className = "sd-fx " + (mode === "full" ? "at-full" : "at-card") + (spinning ? " gone" : "");   // 전환 중이면 처음부터 숨긴 상태로 만들어요
        el.src = sdSrc;
        el.alt = "";
        el.style.setProperty("--sd-w", sdW(ch));
        holder.appendChild(el);
      }

      // 오른쪽 무대를 그려요. mode: "card" | "full",  open: 상세 프로필이 열려 있는지
      function drawStage(ch, mode, open) {
        document.body.setAttribute("data-chview", mode);
        const cls = open ? " flipped" : "";
        if (mode === "full") {
          holder.innerHTML =
            '<div class="cd cd-fb" style="--c:' + cardColor(ch.color) + ';--ct:' + cardText(ch.textColor, ch.color) + ';--sd-w:' + sdW(ch) + '">' +
              '<div class="fb-flip' + cls + '" id="cdFlip">' +
                '<div class="fb-stack">' +
                  '<div class="fb-art">' +
                    '<img class="fb-img" src="' + curBody(ch) + '" alt="">' +
                  '</div>' +
                '</div>' +
              '</div>' +
            '</div>';
          holder.setAttribute("data-type", "full");
          document.getElementById("cdFlip").addEventListener("click", function () { flip(); });
          const fimg = holder.querySelector(".fb-img");
          if (fimg) fimg.addEventListener("load", placeStat);
          drawSd(ch, mode);
          placeStat();
          return;
        }
        const type = ["id", "ticket", "wanted", "custom"].indexOf(ch.type) > -1 ? ch.type : "id";
        const front = type === "custom" ? customFace(ch.customFront, "FRONT") :
                      type === "ticket" ? frontTicket(ch) : type === "wanted" ? frontWanted(ch) : frontId(ch);
        const backFace = type === "custom" ? customFace(ch.customBack, "BACK") :
                      type === "ticket" ? backTicket(ch) : type === "wanted" ? backWanted(ch) : backId(ch);

        holder.innerHTML =
          '<div class="cd cd-' + type + '" style="--c:' + cardColor(ch.color) + ';--c2:' + cardSub(ch.subColor, ch.color) + ';--ct:' + cardText(ch.textColor, ch.color) + ';--cx-r:' + ((ch.customRadius != null) ? ch.customRadius : 12) + 'px">' +
            '<div class="cd-flip' + cls + '" id="cdFlip">' +
              '<div class="cd-face cd-front">' + front + '</div>' +
              '<div class="cd-face cd-back">' + backFace + '</div>' +
            '</div>' +
          '</div>';
        holder.setAttribute("data-type", type);

        document.getElementById("cdFlip").addEventListener("click", function () { flip(); });
        if (type === "custom") sizeCustom(ch);
        drawSd(ch, mode);
        placeStat();
      }

      // 토글을 누르면: 카드가 빙글 돌면서 전신 ↔ 카드로 바뀌어요
      function setView(v) {
        const ch = list[current];
        if (spinning || !ch || v === modeOf(ch) || (v === "full" && !curBody(ch))) return;
        spinning = true;
        statBox.classList.add("swap");
        view = v;
        syncView(ch);
      
        const HIDE = 350;                                   // SD · 포트레이트가 먼저 사라지는 시간
        const old = holder.querySelector(".cd");
        const oldSd = holder.querySelector(".sd-fx");
        if (oldSd) oldSd.classList.add("gone");             // 1단계: SD 사라짐
      
        setTimeout(function () {
          if (old) old.classList.add("spin-out");          // 2단계: 카드/전신 회전 시작
        }, HIDE);
      
        setTimeout(function () {
          drawStage(ch, modeOf(ch), document.body.classList.contains("is-flipped"));
          renderStat(ch);
          const newSd = holder.querySelector(".sd-fx");
          if (newSd) newSd.classList.add("gone");
          const fresh = holder.querySelector(".cd");
          if (fresh) {
            fresh.classList.add("spin-in");
          }
      
          // 설정 글 모양만 바뀌니까, 보던 탭 · 스크롤은 그대로 두기
          const on = detail.querySelector(".dt-tabs button.on");
          const tab = on && on.getAttribute("data-tab");
          const pane0 = detail.querySelector(".dt-panes");
          const top = pane0 ? pane0.scrollTop : 0;
          renderDetail(ch, current);
          if (tab && tab !== "profile") detail.querySelector('.dt-tabs button[data-tab="' + tab + '"]').click();
          const pane1 = detail.querySelector(".dt-panes");
          if (pane1) pane1.scrollTop = top;
      
          setTimeout(function () {
            const s = holder.querySelector(".sd-fx");
            if (s) s.classList.remove("gone");
            statBox.classList.remove("swap");
            spinning = false;
          }, 200);
        }, HIDE + 150);
      }
      viewBox.addEventListener("click", function () {
        const ch = list[current];
        if (!ch || viewBox.disabled) return;
        setView(modeOf(ch) === "full" ? "card" : "full");
        viewBox.blur();             // 스페이스바가 카드 뒤집기로 가도록
      });

      /* =====================================================
         옷장 (상세 프로필 경계의 옷걸이 버튼)
         - 누르면 의상 목록이 경계선을 따라 대각선 아래로 펼쳐져요
         - 고른 의상은 outfitSel 에 기억 → 프로필을 닫았다 열어도, 다른 캐릭터를 다녀와도 그대로예요
         ===================================================== */
      const wd = document.getElementById("chWd");
      const ICON_HANGER = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 8.6V7.3a2.4 2.4 0 1 0-2.4-2.4"/><path d="M12 8.6 3.5 15a1.6 1.6 0 0 0 1 2.9h15a1.6 1.6 0 0 0 1-2.9L12 8.6z"/></svg>';
      const WD_SLOPE = 120;                                           // .ch-detail-bg clip-path 의 기울기(px) — style.css 와 같은 값
      const wdL = function () { return window.innerWidth * 0.48 - 170; };   // .ch-detail-bg 의 left
      const wdBx = function (y, H) { return wdL() + WD_SLOPE * (1 - y / H); };   // 높이 y 에서 경계선의 x

      function wdSetOpen(on) {
        wd.classList.toggle("open", !!on);
        const btn = wd.querySelector(".wd-btn");
        if (btn) btn.setAttribute("aria-expanded", on ? "true" : "false");
        if (!on) return;
        placeWd();
        const lst = wd.querySelector(".wd-list"), cur = wd.querySelector(".wd-thumb.on");
        if (lst && cur) lst.scrollTop = Math.max(0, cur.parentNode.offsetTop - 60);
        slantWd();
      }
      function closeWd() { wdSetOpen(false); }

      // 버튼 · 목록 위치 (경계선 기준)
      function placeWd() {
        const btn = wd.querySelector(".wd-btn"), lst = wd.querySelector(".wd-list");
        if (!btn || !lst) return;
        const H = wd.clientHeight || window.innerHeight;
        const by = Math.max(130, Math.min(170, H * 0.22));
        btn.style.left = (wdBx(by, H) - btn.offsetWidth / 2) + "px";
        btn.style.top = (by - btn.offsetHeight / 2) + "px";
        const first = lst.querySelector(".wd-item");
        const iw = first ? first.offsetWidth : 72;
        const top = by + btn.offsetHeight * 0.71 + 4;      // 마름모 아래 꼭짓점 아래부터
        lst.style.left = (wdL() - iw / 2 - 10) + "px";
        lst.style.width = (WD_SLOPE + iw + 20) + "px";
        lst.style.top = top + "px";
        lst.style.maxHeight = Math.max(120, H - 36 - top) + "px";
        slantWd();
      }
      // 각 의상을 경계선 높이에 맞춰 옆으로 밀어줘요 (스크롤해도 선을 따라가요)
      function slantWd() {
        const lst = wd.querySelector(".wd-list");
        if (!lst) return;
        const H = wd.clientHeight || window.innerHeight;
        Array.prototype.forEach.call(lst.querySelectorAll(".wd-item"), function (it) {
          const y = lst.offsetTop + it.offsetTop - lst.scrollTop + it.offsetHeight / 2;
          it.style.transform = "translateX(" + (wdBx(y, H) - it.offsetWidth / 2 - lst.offsetLeft) + "px)";
        });
      }

      // 그림이 부드럽게 바뀌게
      function swapSrc(img, src) {
        if (!img || img.getAttribute("src") === src) return;
        const pre = new Image();
        const done = function () {
          img.style.opacity = "0";
          setTimeout(function () { img.src = src; img.style.opacity = ""; }, 160);
        };
        pre.onload = done; pre.onerror = done;
        pre.src = src;
      }
      // 의상을 갈아입으면 이름도 바로 바뀌어요 (타일 · 카드 앞면 · 상세 프로필)
      function refreshNames(ch, i) {
        const nm = plainName(cardName(ch));
        const tn = tilesBox.querySelector('.ch-tile-row[data-i="' + i + '"] .ch-tile-name b');
        if (tn) tn.innerHTML = nm;
        const en = cardNameEn(ch);
        const ts = tilesBox.querySelector('.ch-tile-row[data-i="' + i + '"] .ch-tile-name small');
        if (ts) ts.innerHTML = en;
        Array.prototype.forEach.call(holder.querySelectorAll(".cd-front .cd-en, .cd-front .wt-sign"), function (el) { el.innerHTML = en; });
        Array.prototype.forEach.call(holder.querySelectorAll(".cd-front .cd-name, .cd-front .tk-name, .cd-front .tk-stub-label, .cd-front .wt-name"), function (el) { el.innerHTML = nm; });
        const sg = holder.querySelector(".ib-sign b");
        if (sg) sg.innerHTML = cardNameEn(ch) || cardName(ch);
        const dn = detail.querySelector(".dt-name");
        if (dn) {
          const flipped = document.body.classList.contains("is-flipped");
          const from = wornName(ch) || ch.name || "", to = shownDetailName(ch);
          stopMorph();
          morphJobs = morphJobs.filter(function (j) { return j.el !== dn; });
          dn.innerHTML = flipped ? to : from;
          if (!flipped && from !== to) morphJobs.push({ el: dn, from: from, to: to });
          const de = detail.querySelector(".dt-en");
          if (de) {
            const f2 = wornNameEn(ch) || ch.nameEn || "", t2 = shownDetailNameEn(ch);
            morphJobs = morphJobs.filter(function (j) { return j.el !== de; });
            de.innerHTML = flipped ? t2 : f2;
            if (!flipped && f2 !== t2) morphJobs.push({ el: de, from: f2, to: t2 });
          }
        }
      }
      function updateSd(ch) {
        const src = curSd(ch), el = holder.querySelector(".sd-fx");
        if (!src) { if (el) el.remove(); return; }
        if (el) { swapSrc(el, src); return; }
        drawSd(ch, modeOf(ch));                       // 기본 SD 가 없던 캐릭터가 SD 있는 의상을 입은 경우
        const nw = holder.querySelector(".sd-fx");
        if (nw) { nw.classList.add("gone"); setTimeout(function () { nw.classList.remove("gone"); }, 30); }
      }
      function pickOutfit(n) {
        const ch = list[current];
        const b = bodiesOf(ch);
        if (!ch || !b[n]) return;
        outfitSel[PAGE + ":" + current] = n;
        refreshNames(ch, current);
        swapSrc(holder.querySelector(".fb-img"), b[n]);                  // 전신 보기
        swapSrc(detail.querySelector(".dt-story-art > img"), b[n]);      // 카드 보기 (설정 글 옆)
        updateSd(ch);
        Array.prototype.forEach.call(wd.querySelectorAll(".wd-thumb"), function (t) {
          const on = +t.getAttribute("data-n") === n;
          t.classList.toggle("on", on);
          t.parentNode.classList.toggle("on", on);
        });
      }

      function buildWd(i) {
        const ch = list[i];
        const b = ch ? bodiesOf(ch) : [];
        wd.classList.remove("open");
        if (!ch || b.length < 1) { wd.innerHTML = ""; wd.classList.add("none"); return; }
        wd.classList.remove("none");
        wd.style.setProperty("--c", cardColor(ch.color));
        wd.style.setProperty("--ct", cardText(ch.textColor, ch.color));
        const sel = bodyIdx(ch);
        const ents = outfitEntries(ch);
        wd.innerHTML =
          '<button type="button" class="wd-btn" aria-label="옷장" title="옷장" aria-expanded="false">' + ICON_HANGER + '</button>' +
          '<div class="wd-tip" role="tooltip"></div>' +
          '<div class="wd-list">' + b.map(function (src, n) {
            return '<div class="wd-item' + (n === sel ? " on" : "") + '"><button type="button" class="wd-thumb' + (n === sel ? " on" : "") + '" data-n="' + n + '" style="--d:' + Math.min(n, 10) + '" aria-label="' + (ents[n] && ents[n].name ? plainName(ents[n].name).replace(/"/g, "&quot;") : "의상 " + (n + 1)) + '">' +
                   '<span class="wd-in"><img src="' + src + '" alt="" draggable="false"></span></button></div>';
          }).join("") + '</div>';
        const btn = wd.querySelector(".wd-btn"), lst = wd.querySelector(".wd-list");
        btn.addEventListener("click", function () { wdSetOpen(!wd.classList.contains("open")); btn.blur(); });
        lst.addEventListener("scroll", slantWd);
        // 의상 이름 툴팁: 썸네일 아래에 떠요 (목록이 잘라내는 영역이라 바깥 요소로 따로 그려요)
        const tip = wd.querySelector(".wd-tip");
        function hideTip() { tip.classList.remove("on"); }
        function showTip(t) {
          const e = ents[+t.getAttribute("data-n")];
          if (!e || !e.name) { hideTip(); return; }
          tip.innerHTML = plainName(e.name);
          const r = t.parentNode.getBoundingClientRect(), w = wd.getBoundingClientRect();
          const tw = tip.offsetWidth, th = tip.offsetHeight;
          let left = r.left - w.left + r.width / 2 - tw / 2;
          left = Math.max(6, Math.min(left, w.width - tw - 6));
          let top = r.bottom - w.top + 8;
          if (top + th > w.height - 6) top = r.top - w.top - th - 8;   // 아래 공간이 없으면 위로
          tip.style.left = left + "px";
          tip.style.top = top + "px";
          tip.classList.add("on");
        }
        lst.addEventListener("mouseover", function (e) { const t = e.target.closest(".wd-thumb"); if (t) showTip(t); });
        lst.addEventListener("mouseout", function (e) { const t = e.target.closest(".wd-thumb"); if (t && !t.contains(e.relatedTarget)) hideTip(); });
        lst.addEventListener("focusin", function (e) { const t = e.target.closest(".wd-thumb"); if (t) showTip(t); });
        lst.addEventListener("focusout", hideTip);
        lst.addEventListener("scroll", hideTip);
        lst.addEventListener("click", function (e) {
          const t = e.target.closest(".wd-thumb");
          if (!t) return;
          pickOutfit(+t.getAttribute("data-n"));
          t.blur();
        });
        placeWd();
      }
      onResize = function () { placeWd(); placeStat(); };
      onDocDown = function (e) {
        if (wd.classList.contains("open") && !(e.target.closest && e.target.closest(".wd-btn, .wd-list"))) closeWd();
      };

      function render(i) {
        const ch = list[i];
        if (!ch) return;
        shown = i;
        spoilBanner(isSpoil(i));              // 스포일러 캐릭터면 상단 안내가 계속 떠 있어요
        document.body.classList.remove("is-flipped");
        BGM.item("");
        drawStage(ch, modeOf(ch), false);
        syncView(ch);
        renderDetail(ch, i);
        buildWd(i);
        renderStat(ch);

        count.textContent = String(i + 1 + OFFSET).padStart(2, "0") + " / " + String(list.length + OFFSET).padStart(2, "0");
        Array.prototype.forEach.call(tilesBox.querySelectorAll(".ch-tile-row"), function (t) {
          const on = +t.getAttribute("data-i") === i;
          t.classList.toggle("on", on);
          if (on && t.scrollIntoView) t.scrollIntoView({ block: "nearest", behavior: "smooth" });
        });
      }

      function go(i) {
        if (!list.length) return;
        current = (i + list.length) % list.length;
        render(current);
      }

      /* =====================================================
         스포일러 캐릭터 (편집기에서 "스포일러 캐릭터" 를 체크한 캐릭터)
         - 열람 전에 확인 팝업 (예 / 아니오)
         - "예" 로 열어도 화면 위 가운데에 안내 툴팁이 계속 떠 있어요
         ===================================================== */
      let shown = -1;                          // 지금 화면에 펼쳐진 캐릭터
      let spoilAsk = null;                     // 열려 있는 확인 팝업
      const spoilNo = {};                      // "아니오" 한 캐릭터 (키보드 ↑↓ 이동에서 건너뛰어요)
      const isSpoil = function (i) { return !!(list[i] && list[i].spoiler === true); };
      const seenKey = function (i) { return PAGE + ":" + i; };
      const needAsk = function (i) { return isSpoil(i) && !spoilSeen[seenKey(i)]; };   // 이미 "예" 했으면 다시 묻지 않아요

      function askSpoil(i, done) {
        if (spoilAsk) return;
        const el = document.createElement("div");
        el.className = "spoil-ask";
        el.setAttribute("role", "alertdialog");
        el.setAttribute("aria-modal", "true");
        el.innerHTML =
          '<div class="spoil-ask-box">' +
            '<span class="spoil-ask-ico" aria-hidden="true">!</span>' +
            '<p class="spoil-ask-msg">이 캐릭터에는 직·간접적인<br>스포일러가 포함되어 있습니다.<br><b>열람하시겠습니까?</b></p>' +
            '<div class="spoil-ask-btns">' +
              '<button type="button" class="spoil-yes">예</button>' +
              '<button type="button" class="spoil-no">아니오</button>' +
            '</div>' +
          '</div>';
        function close(ok) {
          if (spoilAsk !== api) return;
          spoilAsk = null;
          el.remove();
          done(ok);
        }
        const api = { el: el, close: close };
        spoilAsk = api;
        el.querySelector(".spoil-yes").addEventListener("click", function () { close(true); });
        el.querySelector(".spoil-no").addEventListener("click", function () { close(false); });
        el.addEventListener("mousedown", function (e) { if (e.target === el) close(false); });   // 바깥을 누르면 "아니오"
        document.body.appendChild(el);
        el.querySelector(".spoil-no").focus();   // 실수로 열리지 않게 "아니오" 에 포커스
      }

      // 캐릭터 열기 : 스포일러 캐릭터면 먼저 물어보고, "예" 일 때만 열어요
      function enter(i, after) {
        i = (i + list.length) % list.length;
        if (!needAsk(i)) { go(i); if (after) after(); return; }
        if (i === shown) { if (after) after(); return; }
        askSpoil(i, function (ok) {
          if (!ok) { spoilNo[i] = true; return; }
          delete spoilNo[i];
          spoilSeen[seenKey(i)] = true;
          go(i);
          if (after) after();
        });
      }

      // 위 가운데 안내 툴팁 (body 에 띄워서 페이지가 바뀌면 show() 가 치워요)
      function spoilBanner(on) {
        let b = document.getElementById("spoilBanner");
        if (!b) {
          b = document.createElement("div");
          b.id = "spoilBanner";
          b.className = "spoil-banner";
          b.setAttribute("role", "status");
          b.textContent = "현재 프로필에는 직·간접적인 스포일러 요소가 포함되어 있습니다.";
          document.body.appendChild(b);
        }
        b.classList.toggle("on", !!on);
      }

            // 진영(faction)별로 묶기 — 진영을 하나도 안 적으면 예전과 똑같이 보여요
      const gMap = new Map();
      list.forEach(function (ch, i) {
        const f = String(ch.faction || "").trim();
        if (!gMap.has(f)) gMap.set(f, []);
        gMap.get(f).push(i);
      });
      const groups = [];
      if (gMap.has("")) groups.push({ name: "", items: gMap.get("") });
      gMap.forEach(function (items, name) { if (name) groups.push({ name: name, items: items }); });

      const order = [];
      groups.forEach(function (g) { g.items.forEach(function (i) { order.push(i); }); });
      function step(d) {
        const n = order.length;
        let pos = order.indexOf(current);
        for (let k = 0; k < n; k++) {
          pos = (pos + d + n) % n;
          const t = order[pos];
          if (t === current) return;
          if (spoilNo[t]) continue;            // 이미 "아니오" 한 스포일러 캐릭터는 건너뛰어요
          enter(t);
          return;
        }
      }

      // 왼쪽 타일 만들기
      let k = 0;
      groups.forEach(function (g) {
        if (g.name) {
          const hd = document.createElement("div");
          hd.className = "ch-group";
          hd.innerHTML = "<span>" + g.name + "</span>";
          tilesBox.appendChild(hd);
        }
        g.items.forEach(function (i) {
          const ch = list[i];
          const num = String(i + 1 + OFFSET).padStart(2, "0");
          const img = ch.tile || ch.image;
          const row = document.createElement("button");
          row.className = "ch-tile-row " + (k % 2 ? "odd" : "even");
          row.setAttribute("data-i", i);
          row.style.setProperty("--c", cardColor(ch.color));
          row.innerHTML =
            '<span class="ch-tile-label"><i></i>: ' + num + '</span>' +
            '<span class="ch-tile' + (img ? "" : " empty") + '"' +
              (img ? ' style="background-image:url(\'' + img + '\');background-position:' + (ch.tilePosition || "center 30%") + '"' : "") + '>' +
              '<span class="ch-tile-name"><b>' + plainName(cardName(ch)) + '</b><small>' + cardNameEn(ch) + '</small></span>' +
            '</span>';
          row.addEventListener("click", function () { enter(i); });
          tilesBox.appendChild(row);
          k++;
        });
      });

      // 키보드: ↑ ↓ 캐릭터 선택, 스페이스 뒤집기, Esc 앞면으로
      addKey( function (e) {
        // 스포일러 확인 팝업이 열려 있으면 그것부터 (Esc = 아니오)
        if (spoilAsk) {
          if (e.key === "Escape") { e.preventDefault(); spoilAsk.close(false); }
          return;
        }
        // 라이트박스가 열려 있으면 그것부터
        if (box.classList.contains("open")) {
          if (e.key === "Escape") closeBox();
          if (e.key === "ArrowLeft") moveBox(-1);
          if (e.key === "ArrowRight") moveBox(1);
          return;
        }
        // 옷장이 열려 있으면 Esc 는 옷장부터 닫아요
        if (e.key === "Escape" && wd.classList.contains("open")) { closeWd(); return; }
        if (e.key === "ArrowUp" && !document.body.classList.contains("is-flipped")) { e.preventDefault(); step(-1); }
        if (e.key === "ArrowDown" && !document.body.classList.contains("is-flipped")) { e.preventDefault(); step(1); }
        if (e.key === " ") { e.preventDefault(); flip(); }
        if (e.key === "Escape") flip(false);
      });

      const start0 = CH_START;
      CH_START = null;
      const first = start0 ? start0.i : 0;
      const afterFirst = function () { if (start0 && start0.flip) setTimeout(function () { flip(true); }, 700); };
      if (needAsk(first)) {
        askSpoil(first, function (ok) {
          if (ok) { spoilSeen[seenKey(first)] = true; go(first); afterFirst(); return; }
          spoilNo[first] = true;               // "아니오" → 스포일러 아닌 첫 캐릭터를 보여줘요 (없으면 메인으로)
          const alt = order.filter(function (n) { return !isSpoil(n); })[0];
          if (alt != null) go(alt); else location.hash = "#";
        });
      } else { go(first); afterFirst(); }
      };

      /* ##################################################### */
      /* ##### 페이지: pair ##### */
      /* ##################################################### */
      PAGES.pair = function () {
      /* =====================================================
         페이지 꾸밈
         ===================================================== */
      const D = S.deco || {};
      const P = S.pairPage || {};
      document.getElementById("decoTopLeft").innerHTML =
        (D.badge ? '<span class="badge">' + D.badge + '</span>' : "") +
        '<span class="top-label">' + (P.label || "PAIR FILE") + '</span>' +
        '<span class="top-line"></span>';

      /* =====================================================
         데이터 준비
         - 캐릭터 정보는 characters 에서 그대로 가져와요
         - pairs 한 줄이 두 캐릭터 화면에 서로의 리뷰로 달려요
         ===================================================== */
        const chars = (S.characters || []).concat(S.floormasters || [], S.others || []);
        const CH_N = (S.characters || []).length;
        const FM_N = (S.floormasters || []).length;
        const norm = function (v) {
          const f = /^F(\d+)$/i.exec(String(v)); if (f) return CH_N + (+f[1]);
          const o = /^O(\d+)$/i.exec(String(v)); if (o) return CH_N + FM_N + (+o[1]);
          return v;
        };
        // 포스터에 보이는 No. : Other 는 Other 페이지와 같은 번호(Participant 다음)로 보여줘요
        const dispNo = function (c) { return c > CH_N + FM_N ? c - FM_N : c; };
      const pairs = (S.pairs || []).map(function (p) { return Object.assign({}, p); });
      const num2 = function (n) { return String(n).padStart(2, "0"); };
      const silhouette =
        '<svg viewBox="0 0 100 130" preserveAspectRatio="xMidYMax meet">' +
          '<circle cx="50" cy="48" r="22" fill="currentColor"/>' +
          '<path d="M8 130 C8 92 26 76 50 76 C74 76 92 92 92 130 Z" fill="currentColor"/>' +
        '</svg>';
      const pic = function (ch) {
        const src = ch && (ch.pairImage || ch.image || ch.tile);
        return src ? '<img src="' + src + '" alt="">' : silhouette;
      };
      // 그리드 뷰용: SD 가 없으면 페어 이미지 · 타일 순으로 대신 보여줘요
      const sdPic = function (ch) {
        const src = ch && (ch.sd || ch.pairImage || ch.image || ch.tile);
        return src ? '<img src="' + src + '" alt="" draggable="false">' : silhouette;
      };
      const ICON_GRID = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><rect x="3.5" y="3.5" width="7" height="7" rx="1.5"/><rect x="13.5" y="3.5" width="7" height="7" rx="1.5"/><rect x="3.5" y="13.5" width="7" height="7" rx="1.5"/><rect x="13.5" y="13.5" width="7" height="7" rx="1.5"/></svg>';
      const stars = function (n) {
        n = Math.max(0, Math.min(5, Math.round(+n || 0)));
        let s = "";
        for (let i = 0; i < 5; i++) s += '<i class="' + (i < n ? "on" : "") + '">★</i>';
        return '<span class="rv-stars">' + s + '</span>';
      };

      // 가운데 캐릭터(번호 c, 1부터)에게 달린 리뷰 목록
      /* 페어 데이터 정리 (2~4명)
         members : 캐릭터 번호 목록, sides : 각자 칸 정보, reviews : 리뷰 목록
         예전 형식(a, b, aSide, aToB …)도 그대로 읽어요 */
      pairs.forEach(function (p) {
        if (!p.members) p.members = [p.a, p.b].filter(Boolean);
        p.members = p.members.slice(0, 4);
        if (!p.sides) p.sides = [p.aSide || {}, p.bSide || {}];
        if (!p.reviews) {
          p.reviews = [];
          if (p.aToB) p.reviews.push(Object.assign({ from: p.a, to: p.b }, p.aToB));
          if (p.bToA) p.reviews.push(Object.assign({ from: p.b, to: p.a }, p.bToA));
        }
        p.members = p.members.map(norm);
        p.reviews = p.reviews.map(function (r) { return Object.assign({}, r, { from: norm(r.from), to: norm(r.to) }); });
      });

      // 캐릭터(번호 c, 1부터)가 받은 리뷰 목록
      function reviewsOf(c) {
        const out = [];
        pairs.forEach(function (p, pi) {
          p.reviews.forEach(function (r) {
            if (r.to === c && chars[r.from - 1]) out.push({ pair: pi, from: r.from, msg: r });
          });
        });
        return out;
      }

      /* =====================================================
         오른쪽 포스터 + 왼쪽 리뷰 목록 그리기
         ===================================================== */
      const center = document.getElementById("prCenter");
      const reviewsBox = document.getElementById("prReviews");
      const count = document.getElementById("prCount");
      let current = 0;

      function render(dir) {
        const ch = chars[current];
        if (!ch) return;
        const c = current + 1;
        const list = reviewsOf(c);
        document.body.style.setProperty("--c", cardColor(ch.color));

        /* --- 오른쪽 포스터 --- */
        center.className = "pr-center " + (dir > 0 ? "from-right" : dir < 0 ? "from-left" : "");
        void center.offsetWidth;
        center.classList.add("in");
        center.innerHTML =
          '<div class="pr-gridbar"><button type="button" class="pr-grid-btn" id="prGridBtn" aria-label="그리드 보기 (캐릭터 목록)" title="그리드 보기">' + ICON_GRID + '</button></div>' +
          '<div class="pr-frame">' +
            '<div class="pr-photo">' + pic(ch) + '</div>' +
            '<span class="pr-no">No. ' + num2(dispNo(c)) + '</span>' +
          '</div>' +
          '<div class="pr-info">' +
            '<h2 class="pr-name">' + plainName(ch.name) + '</h2>' +
            '<p class="pr-en">' + (ch.nameEn || "") + '</p>' +
            (ch.intro ? '<p class="pr-intro">' + ch.intro + '</p>' : "") +
          '</div>' +
          '<nav class="pr-nav">' +
            '<button class="pr-arrow prev" id="prPrev" aria-label="이전"><i></i><i></i><i></i></button>' +
            '<span class="pr-idx">' + num2(c) + ' / ' + num2(chars.length) + '</span>' +
            '<button class="pr-arrow next" id="prNext" aria-label="다음"><i></i><i></i><i></i></button>' +
          '</nav>';
        document.getElementById("prGridBtn").addEventListener("click", function () { openGrid(); });
        document.getElementById("prPrev").addEventListener("click", function () { go(current - 1, -1); });
        document.getElementById("prNext").addEventListener("click", function () { go(current + 1, 1); });
        count.textContent = num2(c) + " / " + num2(chars.length);

        /* --- 왼쪽 리뷰 (댓글 스타일) --- */
        const ICON_LIKE = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M7 10v11H3V10h4zm0 0l4-8c1.7 0 3 1.3 3 3v4h5.2c1.2 0 2.1 1.1 1.9 2.3l-1.4 8A2 2 0 0 1 17.7 21H7"/></svg>';
        const ICON_TALK = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M4 5h16v11H9l-5 4V5z"/></svg>';
        const fmt = function (n) { return (+n || 0).toLocaleString("en-US"); };
        const sorted = list.slice().sort(function (x, y) { return (+y.msg.likes || 0) - (+x.msg.likes || 0); });
        const bestN = (P.bestCount != null) ? P.bestCount : 2;
        const rows = sorted.map(function (r, n) {
          const who = chars[r.from - 1];
          const p = pairs[r.pair];
          const meta = [p.label, r.msg.call ? "“" + r.msg.call + "”" : "", r.msg.date].filter(Boolean).join(" · ");
          // 대화: 첫 답은 가운데(메인) 캐릭터, 다음은 리뷰 캐릭터… 번갈아
          const me = chars[c - 1];
          const reps = r.msg.replies || [];
          const thread = reps.map(function (t, k) {
            const speaker = (k % 2 === 0) ? me : who;
            const depth = Math.min(k + 1, 3);
            return '<div class="rp" style="--depth:' + depth + ';--rc:' + cardColor(speaker.color) + '">' +
              '<span class="rp-arrow">ㄴ</span>' +
              '<span class="rv-ava sm">' + pic(speaker) + '</span>' +
              '<div class="rp-body"><b class="rv-name">' + plainName(speaker.name) + '</b><p class="rp-text">' + t + '</p></div>' +
            '</div>';
          }).join("");
          return '<div class="rv" data-pair="' + r.pair + '" style="--rc:' + cardColor(who.color) + ';--d:' + (n * 0.07 + 0.1) + 's">' +
            '<div class="rv-top">' +
              '<span class="rv-ava">' + pic(who) + '</span>' +
              '<div class="rv-main">' +
                '<p class="rv-head">' +
                  (n < bestN && (+r.msg.likes || 0) > 0 ? '<span class="rv-best">BEST</span>' : "") +
                  '<b class="rv-name">' + plainName(who.name) + '</b>' +
                '</p>' +
                '<p class="rv-text">' + (r.msg.review || "") + '</p>' +
                (meta ? '<p class="rv-meta">' + meta + '</p>' : "") +
                '<div class="rv-btns">' +
                  '<span class="rv-btn">' + ICON_LIKE + fmt(r.msg.likes) + '</span>' +
                  '<button class="rv-btn talk"' + (reps.length ? "" : " disabled") + '>' + ICON_TALK + (P.replyButton || "답글") + ' ' + reps.length + '</button>' +
                '</div>' +
              '</div>' +
            '</div>' +
            (reps.length ? '<div class="rv-thread"><div class="rv-thread-in">' + thread + '</div></div>' : "") +
          '</div>';
        }).join("");

        reviewsBox.innerHTML =
          '<header class="rvs-head">' +
            '<p class="rvs-title">' + (P.reviewTitle || "전체") + ' <b>' + fmt(list.length) + '</b></p>' +
            '<p class="rvs-sort">' + (P.sortText || "좋아요 순") + '</p>' +
          '</header>' +
          '<div class="rvs-list">' +
            (rows || '<p class="pr-empty">' + (P.emptyText || "아직 남겨진 리뷰가 없어요.") + '</p>') +
          '</div>';
        reviewsBox.className = "pr-reviews " + (dir > 0 ? "from-right" : dir < 0 ? "from-left" : "");
        void reviewsBox.offsetWidth;
        reviewsBox.classList.add("in");
        // 리뷰 누르면 관계 화면, 답글 버튼 누르면 대화 펼치기
        reviewsBox.querySelectorAll(".rv").forEach(function (card) {
          card.addEventListener("click", function (e) {
            if (e.target.closest(".rv-btn") || e.target.closest(".rv-thread") || e.target.closest("a, .spoil, .fn")) return;
            openRelation(+card.getAttribute("data-pair"));
          });
          const talk = card.querySelector(".rv-btn.talk");
          if (talk) talk.addEventListener("click", function () { card.classList.toggle("open"); });
        });
      }

      function go(i, dir) {
        if (!chars.length) return;
        current = (i + chars.length) % chars.length;
        render(dir || 0);
      }

      /* =====================================================
         그리드 뷰: 캐릭터 SD 를 한눈에 보고, 누르면 그 캐릭터로 이동
         (기존 < > 화살표 · 키보드 ← → 는 그대로예요)
         ===================================================== */
      const pg = document.getElementById("prGrid");
      const pgBody = pg.querySelector(".pg-body");
      function openGrid() {
        pgBody.innerHTML = chars.map(function (ch, i) {
          return '<button type="button" class="pg-item' + (i === current ? " on" : "") + '" data-i="' + i + '" style="--rc:' + cardColor(ch.color) + ';--n:' + Math.min(i, 24) + '">' +
            '<span class="pg-sd">' + sdPic(ch) + '</span>' +
            '<span class="pg-no">' + num2(dispNo(i + 1)) + '</span>' +
            '<span class="pg-name">' + plainName(ch.name) + '</span>' +
          '</button>';
        }).join("");
        pg.setAttribute("aria-hidden", "false");
        pg.classList.add("open");
        const on = pgBody.querySelector(".pg-item.on");
        if (on && on.scrollIntoView) on.scrollIntoView({ block: "center" });
      }
      function closeGrid() {
        pg.classList.remove("open");
        pg.setAttribute("aria-hidden", "true");
      }
      pgBody.addEventListener("click", function (e) {
        const b = e.target.closest(".pg-item");
        if (!b) return;
        const i = +b.getAttribute("data-i");
        closeGrid();
        if (i !== current) go(i, i > current ? 1 : -1);
      });
      pg.addEventListener("click", function (e) { if (e.target === pg || e.target.closest(".pg-close")) closeGrid(); });

      /* =====================================================
         관계 화면
         ===================================================== */
      const rl = document.getElementById("rl");
      const RT = P.relationTabs || { gallery: "GALLERY", timeline: "TIMELINE", trpg: "TRPG BACKUP" };

      // 캐릭터 캡슐 한 줄 (side: "a" = 이미지 왼쪽, "b" = 이미지 오른쪽)
      function capsuleRow(ch, info, side) {
        info = info || {};
        const rc = cardColor(ch.color);
        const img = info.image || ch.pairImage || ch.image;
        const capsule =
          '<div class="rc-wrap">' +
            '<div class="rc" style="--rc:' + rc + '">' +
              '<div class="rc-img">' + (img ? '<img src="' + img + '" alt="">' : silhouette) + '</div>' +
              ((info.catchphrase || info.title) ? '<span class="rc-tag">' + (info.catchphrase || info.title) + '</span>' : "") +
              '<div class="rc-text">' +
                '<h3 class="rc-name"><b>' + plainName(ch.name) + '</b><small>' + (ch.nameEn || "") + '</small></h3>' +
                (info.desc ? '<p class="rc-desc">' + info.desc + '</p>' : "") +
              '</div>' +
            '</div>' +
          '</div>';
        return '<div class="rr rr-' + side + '">' + capsule + '</div>';
      }

      function tabGallery(p) {
        const g = p.gallery || [];
        if (!g.length) return '<p class="rt-empty">' + (P.galleryEmpty || "아직 등록된 이미지가 없어요.") + '</p>';
        return '<div class="rt-gallery">' + g.map(function (x, n) {
          return '<button class="rt-shot' + (x.image ? "" : " empty") + '" data-n="' + n + '">' +
            (x.image ? '<img src="' + x.image + '" alt="">' : '<span>' + num2(n + 1) + '</span>') +
            (x.caption ? '<em>' + x.caption + '</em>' : "") + '</button>';
        }).join("") + '</div>';
      }
      function tabTimeline(p) {
        const t = p.timeline || [];
        if (!t.length) return '<p class="rt-empty">' + (P.timelineEmpty || "아직 등록된 기록이 없어요.") + '</p>';
        return '<ol class="rt-line">' + t.map(function (x) {
          return '<li>' +
            '<span class="rt-date">' + (x.date || "") + '</span>' +
            '<div class="rt-card">' +
              (x.title ? '<h4>' + x.title + '</h4>' : "") +
              (x.text ? '<p>' + x.text + '</p>' : "") +
              (x.image ? '<img src="' + x.image + '" alt="">' : "") +
            '</div>' +
          '</li>';
        }).join("") + '</ol>';
      }
      function tabTrpg(p) {
        const t = p.trpg || [];
        if (!t.length) return '<p class="rt-empty">' + (P.trpgEmpty || "아직 등록된 백업이 없어요.") + '</p>';
        return '<div class="rt-trpg">' + t.map(function (x, n) {
          return '<article class="rt-log" data-n="' + n + '">' +
            '<span class="rt-no">' + num2(n + 1) + '</span>' +
            '<div class="rt-log-main">' +
              '<p class="rt-log-meta">' + [x.system, x.date].filter(Boolean).join(" · ") + '</p>' +
              '<h4>' + (x.title || "") + '</h4>' +
              (x.role ? '<p class="rt-log-role">' + x.role + '</p>' : "") +
              (x.text ? '<p class="rt-log-text">' + x.text + '</p>' : "") +
            '</div>' +
            '<span class="rt-log-go">' + (P.logButton || "LOG") + '<i></i></span>' +
          '</article>';
        }).join("") + '</div>';
      }

      /* =====================================================
         TRPG 로그 보기
         - file : 로그 파일 주소 (코코포리아 html 로그, txt 로그)
                  → 파일을 읽어서 채팅처럼 자동으로 보여줘요
         - link : 파일 대신 외부 링크 (새 창으로 열려요)
         ===================================================== */
      const lv = document.getElementById("logView");
      const esc = function (t) {
        return String(t).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
      };

      // html 조각 → 줄바꿈이 살아있는 안전한 글자
      function cleanHTML(html) {
        const d = document.createElement("div");
        d.innerHTML = String(html).replace(/<br\s*\/?>/gi, "\n");
        return esc(d.textContent.replace(/^\s+|\s+$/g, "")).replace(/\n\s*/g, "<br>");
      }

      // 로그 글자 → [{ tab, name, color, text }]
      function parseLog(raw, fileName) {
        const out = [];
        const isHTML = /\.html?$/i.test(fileName || "") || /<\s*(p|div|span|html|body)[\s>]/i.test(raw);
        if (isHTML) {
          const doc = new DOMParser().parseFromString(raw, "text/html");
          let rows = doc.querySelectorAll("body > p, body > div > p");
          if (!rows.length) rows = doc.querySelectorAll("p");
          rows.forEach(function (row) {
            const sp = row.querySelectorAll(":scope > span");
            if (sp.length >= 3) {                       // 코코포리아 형식
              out.push({
                tab: sp[0].textContent.replace(/[\[\]\s]/g, ""),
                name: sp[1].textContent.trim(),
                color: row.style.color || "",
                text: cleanHTML(sp[2].innerHTML)
              });
            } else if (row.textContent.trim()) {
              out.push(lineFromText(row.innerHTML.replace(/<br\s*\/?>/gi, "\n"), row.style.color));
            }
          });
          if (!out.length) {
            (doc.body.textContent || "").split(/\n/).forEach(function (l) { if (l.trim()) out.push(lineFromText(l)); });
          }
        } else {
          raw.split(/\r?\n/).forEach(function (l) { if (l.trim()) out.push(lineFromText(l)); });
        }
        return out;
      }
      // "[main] 이름 : 내용" 또는 "이름 : 내용"
      function lineFromText(l, color) {
        const d = document.createElement("div");
        d.innerHTML = l;
        const t = d.textContent;
        const m = t.match(/^\s*(?:\[([^\]]{1,20})\]\s*)?([^:：\n]{1,40}?)\s*[:：]\s*([\s\S]*)$/);
        if (m) return { tab: (m[1] || "").trim(), name: m[2].trim(), color: color || "", text: esc(m[3]).replace(/\n/g, "<br>") };
        return { tab: "", name: "", color: color || "", text: esc(t).replace(/\n/g, "<br>") };
      }

      function renderLog(lines, x) {
        const tabs = [];
        lines.forEach(function (l) { if (l.tab && tabs.indexOf(l.tab) < 0) tabs.push(l.tab); });
        lv.querySelector(".lv-tabs").innerHTML = tabs.length > 1
          ? '<button class="on" data-tab="">ALL</button>' + tabs.map(function (t) { return '<button data-tab="' + esc(t) + '">' + esc(t) + '</button>'; }).join("")
          : "";
        lv.querySelector(".lv-body").innerHTML = lines.map(function (l) {
          return '<div class="lv-line' + (l.name ? "" : " sys") + '" data-tab="' + esc(l.tab) + '"' + (l.color ? ' style="--lc:' + l.color + '"' : "") + '>' +
            (l.name ? '<b class="lv-name">' + esc(l.name) + '</b>' : "") +
            '<p class="lv-text">' + l.text + '</p>' +
            (l.tab && tabs.length > 1 ? '<span class="lv-tab">' + esc(l.tab) + '</span>' : "") +
          '</div>';
        }).join("") || '<p class="lv-msg">로그가 비어 있어요.</p>';
        lv.querySelectorAll(".lv-tabs button").forEach(function (b) {
          b.addEventListener("click", function () {
            const t = b.getAttribute("data-tab");
            lv.querySelectorAll(".lv-tabs button").forEach(function (o) { o.classList.toggle("on", o === b); });
            lv.querySelectorAll(".lv-line").forEach(function (o) {
              o.style.display = (!t || o.getAttribute("data-tab") === t) ? "" : "none";
            });
          });
        });
        lv.querySelector(".lv-count").textContent = lines.length + " LINES";
      }

      function openLog(x) {
        if (!x.file && x.link) { window.open(x.link, "_blank", "noopener"); return; }
        lv.querySelector(".lv-meta").textContent = [x.system, x.date, x.role].filter(Boolean).join(" · ");
        lv.querySelector(".lv-title").textContent = x.title || "";
        lv.querySelector(".lv-tabs").innerHTML = "";
        lv.querySelector(".lv-count").textContent = "";
        const raw = lv.querySelector(".lv-raw");
        raw.style.display = (x.file || x.link) ? "" : "none";
        raw.href = x.file || x.link || "#";
        const body = lv.querySelector(".lv-body");
        lv.classList.add("open");
        body.scrollTop = 0;
        if (!x.file) {
          body.innerHTML = '<p class="lv-msg">' + (P.logEmpty || "등록된 로그 파일이 없어요.<br>data.js 의 trpg 에 file: \"로그파일.html\" 을 적어주세요.") + '</p>';
          return;
        }
        body.innerHTML = '<p class="lv-msg">불러오는 중…</p>';

      // 번호에 따라 늘 같은 모양이 나오는 바코드
      function barcode(seed) {
        let h = 0;
        const str = String(seed || "0");
        for (let i = 0; i < str.length; i++) h = (h * 31 + str.charCodeAt(i)) >>> 0;
        let bars = "";
        for (let i = 0; i < 46; i++) {

      function qr(seed) {
        const N = 21;

        const str = String(seed || "0");
        for (let i = 0; i < str.length; i++) h = (h * 33 + str.charCodeAt(i)) >>> 0;
        let r = "";
        const finder = function (x, y) {
          return '<rect x="' + x + '" y="' + y + '" width="7" height="7"/>' +
                 '<rect x="' + (x + 1) + '" y="' + (y + 1) + '" width="5" height="5" fill="var(--paper)"/>' +
                 '<rect x="' + (x + 2) + '" y="' + (y + 2) + '" width="3" height="3"/>';
        };
        for (let y = 0; y < N; y++) for (let x = 0; x < N; x++) {
          const inF = (x < 8 && y < 8) || (x > 12 && y < 8) || (x < 8 && y > 12);
          if (inF) continue;
          h = (h * 1103515245 + 12345) >>> 0;
          if ((h >>> 16) % 2) r += '<rect x="' + x + '" y="' + y + '" width="1" height="1"/>';
        }
        return '<svg class="wt-qr" viewBox="0 0 21 21" shape-rendering="crispEdges">' +
          r + finder(0, 0) + finder(14, 0) + finder(0, 14) + '</svg>';

        // 배너 코드 복사
        detail.querySelectorAll(".bn-copy").forEach(function (b) {

            const done = function () { b.textContent = BN.copiedText || "COPIED!"; setTimeout(function () { b.textContent = BN.copyText || "COPY"; }, 1500); };
            if (navigator.clipboard && window.isSecureContext) navigator.clipboard.writeText(code).then(done, fallback);
            else fallback();
            function fallback() {
              const t = document.createElement("textarea");
              t.value = code; document.body.appendChild(t); t.select();
              try { document.execCommand("copy"); done(); } catch (e) {}
