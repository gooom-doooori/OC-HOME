      /* =====================================================
         카드 그리기 · 뒤집기
         ===================================================== */
            const holder = document.getElementById("chHolder");
      function flip(on) {
        const f = document.getElementById("cdFlip");
        if (!f) return;
        const next = (on === undefined) ? !f.classList.contains("flipped") : on;
        f.classList.toggle("flipped", next);
        document.body.classList.toggle("is-flipped", next);
      }

      // SD: 카드 밖(홀더)에서 따로 그려요
      function drawSd(o) {
        const old = holder.querySelector(".sd-fx");
        if (old) old.remove();
        if (!o.sd) return;
        const el = document.createElement("img");
        el.className = "sd-fx at-card";
        el.src = o.sd;
        el.alt = "";
        el.style.setProperty("--sd-w", sdW(o));
        holder.appendChild(el);
      }

      function draw(o) {
        usePrefs(o);
        const type = ["id", "ticket", "wanted", "custom"].indexOf(o.type) > -1 ? o.type : "id";
        const faceF = type === "custom" ? customFace(o.customFront, "FRONT") :
                      type === "ticket" ? frontTicket(o) : type === "wanted" ? frontWanted(o) : front(o);
        const faceB = type === "custom" ? customFace(o.customBack, "BACK") :
                      type === "ticket" ? backTicket(o) : type === "wanted" ? backWanted(o) : back(o);

        holder.setAttribute("data-type", type);
        holder.innerHTML =
          '<div class="cd cd-' + type + (type === "id" ? " ow-card" : "") + '" style="--c:' + cardColor(o.color) + ';--c2:' + cardSub(o.subColor, o.color) + ';--ct:' + cardText(o.textColor, o.color) + ';--cx-r:' + ((o.customRadius != null) ? o.customRadius : 12) + 'px">' +
            (type === "id" && o.strap !== false ? '<div class="ow-strap"><span>' + (o.strap || "") + '</span></div><div class="ow-clip"></div>' : "") +
            '<div class="cd-flip" id="cdFlip">' +
              '<div class="cd-face cd-front">' + faceF + '</div>' +
              '<div class="cd-face cd-back">' + faceB + '</div>' +
            '</div>' +
          '</div>';
        if (type === "custom") sizeCustom(o);
        drawSd(o);
        const fl = document.getElementById("cdFlip");
        fl.addEventListener("click", function (e) {
          if (e.target.closest("a")) return;
          flip();
        });
        if (document.body.classList.contains("is-flipped")) fl.classList.add("flipped");
        renderDetail(o);
      }

      const many = OWNERS.length > 1;
      const sw = document.getElementById("owSwitch");
      let current = 0, busy = false;

      function mark() {
        sw.querySelectorAll(".ow-tile").forEach(function (b, n) { b.classList.toggle("on", n === current); });
      }
      function go(i) {
        if (!many || busy) return;
        const n = (i + OWNERS.length) % OWNERS.length;
        if (n === current) return;
        busy = true;
        current = n;
        mark();
        holder.classList.add("ow-out");
        setTimeout(function () {
          draw(OWNERS[current]);
          holder.classList.remove("ow-out");
          busy = false;
        }, 200);
      }

      if (many) {
        document.querySelector(".ow-page").classList.add("ow-multi");
        // 타일 얼굴: SD 이미지 → 프로필 이미지(원형) → 이름 첫 글자(원형, 대표색 배경)
        const face = function (o) {
          if (o.sd) return '<img class="ow-sd" src="' + esc(o.sd) + '" alt="" draggable="false">';
          const first = Array.from(String(o.name || "?").trim())[0] || "?";
          return '<span class="ow-ava" style="--c:' + cardColor(o.color) + ';--ct:' + cardText("", o.color) + '">' +
            (o.image ? '<img src="' + esc(o.image) + '" alt="" draggable="false">' : '<b>' + esc(first) + '</b>') + '</span>';
        };
        sw.innerHTML = '<div class="ow-tiles-in">' + OWNERS.map(function (o, i) {
          return '<button type="button" class="ow-tile" data-i="' + i + '" style="animation-delay:' + (0.05 + i * 0.07) + 's">' +
            face(o) + '<span class="ow-tile-name">' + esc(o.name || ("OWNER " + (i + 1))) + '</span></button>';
        }).join("") + '</div>';
        sw.addEventListener("click", function (e) {
          const b = e.target.closest(".ow-tile");
          if (b) go(Number(b.getAttribute("data-i")));
        });
      }

      draw(OWNERS[0]);
      mark();

      addKey( function (e) {
        if (e.key === " ") { e.preventDefault(); flip(); }
        if (e.key === "Escape") flip(false);
        if (e.key === "ArrowLeft") go(current - 1);
        if (e.key === "ArrowRight") go(current + 1);
        if (e.key === "ArrowUp" && !document.body.classList.contains("is-flipped")) { e.preventDefault(); go(current - 1); }
        if (e.key === "ArrowDown" && !document.body.classList.contains("is-flipped")) { e.preventDefault(); go(current + 1); }
      });
      };

      /* ##################################################### */
      /* ##### 페이지: guest ##### */
      /* ##################################################### */
      PAGES.guest = function () {
      /* =====================================================
         페이지 꾸밈
         ===================================================== */
      const D = S.deco || {};
      const G = S.guest || {};
      const FM = G.form || {};
      document.getElementById("decoTopLeft").innerHTML =
        (D.badge ? '<span class="badge">' + D.badge + '</span>' : "") +
        '<span class="top-label">' + (G.label || "GUEST BOOK") + '</span>' +
        '<span class="top-line"></span>';

      const wrap = document.getElementById("gbWrap");
      const esc = function (t) {
        return String(t == null ? "" : t).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
      };
      const nl = function (t) { return esc(t).replace(/\r?\n/g, "<br>"); };
      const mode = ["form", "widget", "links", "firebase"].indexOf(G.mode) > -1 ? G.mode : "form";

      /* ----- 익명 질문 링크 (모든 방식에서 아래에 함께 나와요) ----- */
      function linkCards(big) {
        const L = G.links || [];
        if (!L.length) return "";
        return '<div class="gb-links' + (big ? " big" : "") + '">' + L.map(function (l) {
          const inner =
            '<b>' + esc(l.label || "") + '</b>' +
            '<span class="gb-link-text"><strong>' + esc(l.text || "") + '</strong>' +
            (big && l.desc ? '<small>' + esc(l.desc) + '</small>' : "") + '</span>' +
            '<i></i>';
          return l.url
            ? '<a class="gb-link" href="' + esc(l.url) + '" target="_blank" rel="noopener">' + inner + '</a>'
            : '<span class="gb-link off">' + inner + '</span>';
        }).join("") + '</div>';
      }

      const head =
        '<header class="gb-head">' +
          '<h2>' + esc(G.title || "GUEST BOOK") + '</h2>' +
          (G.intro ? '<p>' + G.intro + '</p>' : "") +
        '</header>';

      /* =====================================================
         1. 구글 폼 + 구글 시트 방식
         ===================================================== */
      function setupForm() {
        // 미리 채워진 링크에서 폼 주소와 칸 번호 읽기
        let post = "", eName = "", eMsg = "", eSecret = "", vSecret = "";
        try {
          if (FM.formLink) {
            const u = new URL(FM.formLink);
            post = u.origin + u.pathname.replace(/\/(viewform|formResponse).*$/, "/formResponse");
            u.searchParams.forEach(function (v, k) {
              if (!/^entry\./.test(k)) return;
              if (v === "NAME") eName = k;
              else if (v === "MESSAGE") eMsg = k;
              else { eSecret = k; vSecret = v; }
            });
          }
        } catch (e) {}
        const ready = post && eName && eMsg;

        wrap.innerHTML = head +
          '<div class="gb-grid">' +
            '<section class="gb-write">' +
              '<h3>' + esc(FM.writeTitle || "WRITE") + '</h3>' +
              '<label class="gb-field"><span>' + esc(FM.nameLabel || "이름") + '</span>' +
                '<input id="gbName" maxlength="20" placeholder="' + esc(FM.namePlaceholder || "닉네임") + '"></label>' +
              '<label class="gb-field"><span>' + esc(FM.messageLabel || "내용") + '</span>' +
                '<textarea id="gbMsg" rows="7" maxlength="1000" placeholder="' + esc(FM.messagePlaceholder || "남기고 싶은 말을 적어주세요.") + '"></textarea></label>' +
              '<div class="gb-row">' +
                (eSecret ? '<label class="gb-check"><input type="checkbox" id="gbSecret"><i></i>' + esc(FM.secretLabel || "비밀글") + '</label>' : '<span></span>') +
                '<button class="gb-submit" id="gbSubmit">' + esc(FM.submitText || "남기기") + '</button>' +
              '</div>' +
              '<p class="gb-status" id="gbStatus">' + (ready ? "" : esc(FM.notReadyText || "아직 방명록이 연결되지 않았어요. (data.js 의 guest 설정을 확인해 주세요)")) + '</p>' +
              linkCards(false) +
            '</section>' +
            '<section class="gb-list">' +
              '<p class="gb-list-head"><span>' + esc(FM.listTitle || "전체") + ' <b id="gbCount">0</b></span><span>' + esc(FM.sortText || "최신 순") + '</span></p>' +
              '<div id="gbItems" class="gb-items"><p class="gb-empty">불러오는 중…</p></div>' +
              '<button class="gb-more" id="gbMore">' + esc(FM.moreText || "더 보기") + '</button>' +
            '</section>' +
          '</div>';

        /* --- 글 목록 --- */
        const items = document.getElementById("gbItems");
        const more = document.getElementById("gbMore");
        const per = FM.perPage || 10;
        let all = [], shown = 0;
        const col = Object.assign({ time: 1, name: 2, message: 3, secret: 4, reply: 5, hide: 6 }, FM.columns || {});

        function fmtDate(t) {
          const m = String(t || "").match(/(\d{4})\D+(\d{1,2})\D+(\d{1,2})/);
          return m ? m[1] + "." + ("0" + m[2]).slice(-2) + "." + ("0" + m[3]).slice(-2) : String(t || "");
        }
        function card(e, n) {
          const secret = !!e.secret;
          const initial = String(e.name || "?").trim().charAt(0) || "?";
          return '<article class="gb-item' + (secret ? " secret" : "") + (e.pending ? " pending" : "") + '" style="--d:' + (n % per * 0.05) + 's">' +
            '<span class="gb-ava">' + esc(initial) + '</span>' +
            '<div class="gb-main">' +
              '<p class="gb-meta"><b>' + esc(e.name || "익명") + '</b>' +
                (secret ? '<span class="gb-lock">' + esc(FM.secretLabel || "비밀글") + '</span>' : "") +
                '<small>' + esc(e.pending ? (FM.pendingText || "반영 대기 중") : fmtDate(e.time)) + '</small></p>' +
              '<p class="gb-text">' + (secret ? esc(FM.secretText || "비밀글이에요. 오너만 볼 수 있어요.") : nl(e.message)) + '</p>' +
              (e.reply ? '<div class="gb-reply"><span class="gb-reply-arrow">ㄴ</span>' +
                (G.ownerImage ? '<span class="gb-ava sm img"><img src="' + esc(G.ownerImage) + '" alt=""></span>' : '<span class="gb-ava sm owner">' + esc(String(G.ownerName || "O").charAt(0)) + '</span>') +
                '<div><b>' + esc(G.ownerName || "오너") + '</b><p>' + (secret && !FM.showSecretReply ? esc(FM.secretText || "비밀글이에요. 오너만 볼 수 있어요.") : nl(e.reply)) + '</p></div></div>' : "") +
            '</div>' +
          '</article>';
        }
        function draw() {
          document.getElementById("gbCount").textContent = all.length;
          if (!all.length) { items.innerHTML = '<p class="gb-empty">' + esc(FM.emptyText || "아직 남겨진 글이 없어요. 첫 글을 남겨주세요!") + '</p>'; more.style.display = "none"; return; }
          shown = Math.min(Math.max(shown, per), all.length);
          items.innerHTML = all.slice(0, shown).map(card).join("");
          more.style.display = shown < all.length ? "" : "none";
        }
        more.addEventListener("click", function () { shown += per; draw(); });

        // CSV 읽기 (따옴표 · 줄바꿈 포함)
        function parseCSV(t) {
          const rows = []; let row = [], cur = "", q = false;
          for (let i = 0; i < t.length; i++) {
            const c = t[i];
            if (q) {
              if (c === '"') { if (t[i + 1] === '"') { cur += '"'; i++; } else q = false; }
              else cur += c;
            } else if (c === '"') q = true;
            else if (c === ",") { row.push(cur); cur = ""; }
            else if (c === "\n" || c === "\r") {
              if (c === "\r" && t[i + 1] === "\n") i++;
              row.push(cur); rows.push(row); row = []; cur = "";
            } else cur += c;
          }
          if (cur || row.length) { row.push(cur); rows.push(row); }
          return rows;
        }
        const pick = function (r, k) { return (r[col[k] - 1] || "").trim(); };

        if (FM.sheetCsv) {
          fetch(FM.sheetCsv + (FM.sheetCsv.indexOf("?") > -1 ? "&" : "?") + "t=" + Date.now())
            .then(function (r) { if (!r.ok) throw new Error(r.status); return r.text(); })
            .then(function (t) {
              all = parseCSV(t).slice(1)
                .filter(function (r) { return pick(r, "message") && !pick(r, "hide"); })
                .map(function (r) {
                  return { time: pick(r, "time"), name: pick(r, "name"), message: pick(r, "message"),
                           secret: pick(r, "secret"), reply: pick(r, "reply") };
                }).reverse();
              draw();
            })
            .catch(function () {
              items.innerHTML = '<p class="gb-empty">' + esc(FM.loadErrorText || "글 목록을 불러오지 못했어요.") + '</p>';
            });
        } else {
          all = (G.sample || []).slice();   // 연결 전 미리보기용 예시 글
          draw();
        }

        /* --- 글쓰기 --- */
        const st = document.getElementById("gbStatus");
        const btn = document.getElementById("gbSubmit");
        btn.addEventListener("click", function () {
          const name = document.getElementById("gbName").value.trim();
          const msg = document.getElementById("gbMsg").value.trim();
          const sec = document.getElementById("gbSecret");
          if (!name || !msg) { st.textContent = FM.emptyInputText || "이름과 내용을 모두 적어주세요."; st.className = "gb-status warn"; return; }
          if (!ready) { st.textContent = FM.notReadyText || "아직 방명록이 연결되지 않았어요."; st.className = "gb-status warn"; return; }
          const body = new URLSearchParams();
          body.append(eName, name);
          body.append(eMsg, msg);
          if (sec && sec.checked) body.append(eSecret, vSecret);
          btn.disabled = true;
          st.textContent = "보내는 중…"; st.className = "gb-status";
          fetch(post, { method: "POST", mode: "no-cors", body: body })
            .then(function () {
              all.unshift({ name: name, message: msg, secret: sec && sec.checked, pending: true });
              shown++;
              draw();
              document.getElementById("gbName").value = "";
              document.getElementById("gbMsg").value = "";
              if (sec) sec.checked = false;
              st.textContent = FM.doneText || "남겨주셔서 고마워요! 목록에 뜨기까지 몇 분 걸릴 수 있어요.";
              st.className = "gb-status ok";
            })
            .catch(function () { st.textContent = "보내지 못했어요. 잠시 후 다시 시도해 주세요."; st.className = "gb-status warn"; })
            .then(function () { btn.disabled = false; });
        });
      }

      /* =====================================================
         2. 외부 방명록 위젯 방식
         ===================================================== */
      function setupWidget() {
        const W = G.widget || {};
        wrap.innerHTML = head +
          '<section class="gb-widget" id="gbWidget">' +
            (W.url ? '<iframe src="' + esc(W.url) + '" style="height:' + (W.height || 640) + 'px" loading="lazy"></iframe>' : "") +
          '</section>' + linkCards(false);

            const s = document.createElement("script");

        if (!W.url && !W.code) box.innerHTML = '<p class="gb-empty">' + esc(W.emptyText || "방명록 위젯 코드가 아직 없어요. (data.js 의 guest.widget 을 확인해 주세요)") + '</p>';

      function setupLinks() {

      }

      /* =====================================================
         4. Firebase 방식 (비밀글은 오너만 읽어요)

      function setupFirebase() {
        const FB = G.firebase || {}, cfg = FB.config || {};
        const COL = FB.collection || "guests";
        const BASE = "https://www.gstatic.com/firebasejs/" + (S.firebaseSdk || "13.0.0") + "/";
        const ready = !!(cfg.apiKey && cfg.projectId);

        wrap.innerHTML = head +
          '<div class="gb-grid">' +
            '<section class="gb-write">' +
              '<h3>' + esc(FM.writeTitle || "WRITE") + '</h3>' +
              '<label class="gb-field"><span>' + esc(FM.nameLabel || "이름") + '</span>' +
                '<input id="gbName" maxlength="20" placeholder="' + esc(FM.namePlaceholder || "닉네임") + '"></label>' +
              '<label class="gb-field"><span>' + esc(FM.messageLabel || "내용") + '</span>' +
                '<textarea id="gbMsg" rows="7" maxlength="1000" placeholder="' + esc(FM.messagePlaceholder || "남기고 싶은 말을 적어주세요.") + '"></textarea></label>' +
              '<div class="gb-row">' +
                '<label class="gb-check"><input type="checkbox" id="gbSecret"><i></i>' + esc(FM.secretLabel || "비밀글") + '</label>' +
                '<button class="gb-submit" id="gbSubmit">' + esc(FM.submitText || "남기기") + '</button>' +
              '</div>' +
              '<p class="gb-status" id="gbStatus">' + (ready ? "" : esc(FM.notReadyText || "아직 방명록이 연결되지 않았어요. (설치 화면 #setup 을 확인해 주세요)")) + '</p>' +
              linkCards(false) +
            '</section>' +
            '<section class="gb-list">' +
              '<p class="gb-list-head"><span>' + esc(FM.listTitle || "전체") + ' <b id="gbCount">0</b></span><span>' + esc(FM.sortText || "최신 순") + '</span></p>' +
              '<div id="gbItems" class="gb-items"><p class="gb-empty">불러오는 중…</p></div>' +
              '<button class="gb-more" id="gbMore">' + esc(FM.moreText || "더 보기") + '</button>' +
            '</section>' +
          '</div>';

        const items = document.getElementById("gbItems");
        const more = document.getElementById("gbMore");
        const per = FM.perPage || 10;
        let all = [], shown = 0;

        function pad(n) { return ("0" + n).slice(-2); }
        function fmtTs(ts) {
          const d = ts && ts.toDate ? ts.toDate() : (ts instanceof Date ? ts : null);
          return d ? d.getFullYear() + "." + pad(d.getMonth() + 1) + "." + pad(d.getDate()) : "";
        }
        function card(e, n) {
          const initial = String(e.name || "?").trim().charAt(0) || "?";
          return '<article class="gb-item' + (e.pending ? " pending" : "") + '" style="--d:' + (n % per * 0.05) + 's">' +
            '<span class="gb-ava">' + esc(initial) + '</span>' +
            '<div class="gb-main">' +
              '<p class="gb-meta"><b>' + esc(e.name || "익명") + '</b><small>' + esc(e.pending ? (FM.pendingText || "방금") : (e.time || "")) + '</small></p>' +
              '<p class="gb-text">' + nl(e.message) + '</p>' +
              (e.reply ? '<div class="gb-reply"><span class="gb-reply-arrow">ㄴ</span>' +
                (G.ownerImage ? '<span class="gb-ava sm img"><img src="' + esc(G.ownerImage) + '" alt=""></span>' : '<span class="gb-ava sm owner">' + esc(String(G.ownerName || "O").charAt(0)) + '</span>') +
                '<div><b>' + esc(G.ownerName || "오너") + '</b><p>' + nl(e.reply) + '</p></div></div>' : "") +
            '</div>' +
          '</article>';
        }
        function draw() {
          document.getElementById("gbCount").textContent = all.length;
          if (!all.length) { items.innerHTML = '<p class="gb-empty">' + esc(FM.emptyText || "아직 남겨진 글이 없어요. 첫 글을 남겨주세요!") + '</p>'; more.style.display = "none"; return; }
          shown = Math.min(Math.max(shown, per), all.length);
          items.innerHTML = all.slice(0, shown).map(card).join("");
          more.style.display = shown < all.length ? "" : "none";
        }
        more.addEventListener("click", function () { shown += per; draw(); });

        const st = document.getElementById("gbStatus");
        const btn = document.getElementById("gbSubmit");
        let conn = null;
        function db() {
          if (!conn) conn = Promise.all([import(BASE + "firebase-app.js"), import(BASE + "firebase-firestore.js")])
            .then(function (m) { return { fs: m[1], db: m[1].getFirestore(m[0].getApps().length ? m[0].getApps()[0] : m[0].initializeApp(cfg)) }; });
          return conn;
        }

        if (!ready) { all = (G.sample || []).slice(); draw(); }
        else {
          db().then(function (c) {
            return c.fs.getDocs(c.fs.query(c.fs.collection(c.db, COL), c.fs.where("secret", "==", false), c.fs.limit(300)));
          }).then(function (snap) {
            const rows = [];
            snap.forEach(function (d) {
              const v = d.data();
              rows.push({ ms: v.createdAt && v.createdAt.toMillis ? v.createdAt.toMillis() : 0, time: fmtTs(v.createdAt),
                          name: v.name, message: v.message, reply: v.reply });
            });
            rows.sort(function (a, b) { return b.ms - a.ms; });
            all = rows; draw();
          }).catch(function (err) {
            if (window.console) console.error(err);
            items.innerHTML = '<p class="gb-empty">' + esc(FM.loadErrorText || "글 목록을 불러오지 못했어요.") + '</p>';
          });
        }

        btn.addEventListener("click", function () {
          const name = document.getElementById("gbName").value.trim();
          const msg = document.getElementById("gbMsg").value.trim();
          const sec = document.getElementById("gbSecret");
          if (!name || !msg) { st.textContent = FM.emptyInputText || "이름과 내용을 모두 적어주세요."; st.className = "gb-status warn"; return; }
          if (!ready) { st.textContent = FM.notReadyText || "아직 방명록이 연결되지 않았어요."; st.className = "gb-status warn"; return; }
          const secret = !!(sec && sec.checked);
          btn.disabled = true;
          st.textContent = "보내는 중…"; st.className = "gb-status";
          db().then(function (c) {
            return c.fs.addDoc(c.fs.collection(c.db, COL), { name: name, message: msg, secret: secret, createdAt: c.fs.serverTimestamp() });
          }).then(function () {
            document.getElementById("gbName").value = "";
            document.getElementById("gbMsg").value = "";
            if (sec) sec.checked = false;
            if (secret) {
              st.textContent = FM.secretText || "비밀글이에요. 오너만 볼 수 있어요.";
            } else {
              all.unshift({ name: name, message: msg, pending: true });
              shown++; draw();
              st.textContent = FM.doneText2 || "남겨주셔서 고마워요!";
            }
            st.className = "gb-status ok";
          }).catch(function (err) {
            if (window.console) console.error(err);
            st.textContent = "보내지 못했어요. 잠시 후 다시 시도해 주세요."; st.className = "gb-status warn";
          }).then(function () { btn.disabled = false; });
        });
      }
      if (mode === "firebase") setupFirebase();
      else if (mode === "widget") setupWidget();
      else if (mode === "links") setupLinks();
      else setupForm();
      wrap.classList.add("mode-" + mode);
      };

      const app = document.getElementById("app");
      function show(route) {
        if (ROUTES.indexOf(route) < 0) route = "home";
        keyHandlers = [];
        onResize = null; onDocDown = null;
        BGM.reset();
        document.querySelectorAll("#spoilBanner, .spoil-ask").forEach(function (n) { n.remove(); });
        document.body.classList.remove("is-flipped", "no-tint", "sd-always", "ch-single", "stat-on");
        document.body.removeAttribute("data-chview");
        document.body.setAttribute("data-page", route);
                app.innerHTML = document.getElementById("tpl-" + ((route === "floormaster" || route === "other") ? "character" : route)).innerHTML;
        app.classList.remove("page-in");
        void app.offsetWidth;
        app.classList.add("page-in");
        window.scrollTo(0, 0);
        document.title = TITLES[route] ? TITLES[route] + (S.pageTitle ? " | " + S.pageTitle : "") : (S.pageTitle || "Home");
        PAGES[route]();
      }
      window.addEventListener("hashchange", function () { show(location.hash.slice(1)); });
      // 링크 · 이미지 끌기 막기
      document.addEventListener("dragstart", function (e) {
        const el = e.target && (e.target.nodeType === 1 ? e.target : e.target.parentElement);
        const t = el && el.closest("a, img");
        if (t && !t.closest(".ch-detail, #oha")) e.preventDefault();
      });
      show(location.hash.slice(1));
    })();
  </script>
  <!-- 관리자 편집기 (#admin) / 설치 화면 (#setup) : 필요할 때만 admin.js 를 불러와요 -->
  <script>
  (function () {
    function view() { var m = location.hash.match(/^#\/?(admin|setup)/); return m && m[1]; }
    function open() {
      var v = view(); if (!v) return;
      if (window.OHAdmin) return window.OHAdmin.mount(v);
      var s = document.createElement('script');
      s.src = 'admin.js';
      s.onload = function () { window.OHAdmin.mount(v); };
      document.body.appendChild(s);
    }
    window.addEventListener('hashchange', open);
    open();
  })();
  </script>

  <script>
(function () {
  var bar = document.createElement("div");
  bar.className = "dt-bar";
  bar.innerHTML = "<i></i>";
  document.body.appendChild(bar);
  var thumb = bar.firstChild;
  var pane = null, maxTop = 0, dragging = false, startY = 0, startScroll = 0;

  function update() {
    pane = document.querySelector(".dt-panes");
    var det = pane && pane.closest(".ch-detail");
    var on = pane && det && pane.offsetParent &&
             pane.scrollHeight > pane.clientHeight + 1 &&
             getComputedStyle(det).visibility === "visible";
    if (!on) { bar.classList.remove("show"); return; }

    var r = pane.getBoundingClientRect();
    var trackH = r.height - 16;
    var thumbH = Math.max(36, trackH * pane.clientHeight / pane.scrollHeight);
    var range = pane.scrollHeight - pane.clientHeight;
    maxTop = trackH - thumbH;

    bar.style.left = (r.right + 10) + "px";
    bar.style.top = (r.top + 8) + "px";
    bar.style.height = trackH + "px";
    thumb.style.height = thumbH + "px";
    thumb.style.top = (maxTop * pane.scrollTop / range) + "px";

    var c = getComputedStyle(pane).getPropertyValue("--c").trim();
    if (c) bar.style.setProperty("--c", c);
    bar.classList.add("show");
  }

  thumb.addEventListener("pointerdown", function (e) {
    dragging = true; startY = e.clientY; startScroll = pane.scrollTop;
    thumb.setPointerCapture(e.pointerId);
    bar.classList.add("drag");
    e.preventDefault();
  });
  thumb.addEventListener("pointermove", function (e) {
    if (!dragging || !maxTop) return;
    pane.scrollTop = startScroll + (e.clientY - startY) * (pane.scrollHeight - pane.clientHeight) / maxTop;
  });
  thumb.addEventListener("pointerup", function () { dragging = false; bar.classList.remove("drag"); });

  (function tick() { update(); requestAnimationFrame(tick); })();
})();
</script>
<script>
/* ===== 스포일러 · 링크 · 각주 겹침 처리 ===== */
(function () {
  var passing = false;      // 우리가 일부러 발생시킨 클릭은 다시 가로채지 않게
  var tip = null, lastFn = null;

  /* 스포일러 자신에게 걸린 링크 (각주 팝업 안의 링크는 제외) */
  function ownLink(sp) {
    var list = sp.querySelectorAll("a[href], a[data-ch]");
    for (var i = 0; i < list.length; i++) {
      var f = list[i].closest(".fn");
      if (!(f && sp.contains(f))) return list[i];
    }
    return sp.closest("a[href], a[data-ch]");
  }
  /* 클릭한 자리가 이 스포일러의 링크 위인지 */
  function linkAt(sp, t) {
    var a = t.closest("a");
    if (!a || !(a.hasAttribute("href") || a.hasAttribute("data-ch"))) return null;
    return (sp.contains(a) || a.contains(sp)) ? a : null;
  }
  function fire(a) { passing = true; try { a.click(); } finally { passing = false; } }

  /* ----- 안내 말풍선 (열린 스포일러의 "링크 위"에 마우스를 올렸을 때만) ----- */
  function showTip(sp, anchor) {
    if (!tip) { tip = document.createElement("div"); tip.className = "spoil-tip"; document.body.appendChild(tip); }
    tip.textContent = "더블클릭: 링크 열기";
    tip.__sp = sp; tip.__a = anchor;
    tip.classList.add("on");
    var r = anchor.getBoundingClientRect(), w = tip.offsetWidth, h = tip.offsetHeight;
    var x = Math.max(8, Math.min(r.left + r.width / 2 - w / 2, document.documentElement.clientWidth - w - 8));
    var y = r.top - h - 8; if (y < 8) y = r.bottom + 8;
    tip.style.left = x + "px"; tip.style.top = y + "px";
  }
  function hideTip() { if (tip) { tip.classList.remove("on"); tip.__sp = null; tip.__a = null; } }
  function afterChange() { if (tip && tip.__sp && !tip.__sp.classList.contains("open")) hideTip(); }

  /* ----- 각주 팝업 (body 에 띄움) ----- */
  var ftip = null, curFn = null, hideT = 0;
  function hideFn() { clearTimeout(hideT); if (ftip) ftip.classList.remove("on"); curFn = null; }
  function schedHide() { clearTimeout(hideT); hideT = setTimeout(hideFn, 120); }
  function placeFn(fn) {
    ftip.style.left = "0px"; ftip.style.top = "0px";
    var r = fn.getBoundingClientRect(), w = ftip.offsetWidth, h = ftip.offsetHeight;
    var vw = document.documentElement.clientWidth;
    var x = Math.max(8, Math.min(r.left + r.width / 2 - w / 2, vw - w - 8));
    var below = r.top - h - 10 < 8;
    ftip.classList.toggle("down", below);
    ftip.style.left = x + "px";
    ftip.style.top = (below ? r.bottom + 10 : r.top - h - 10) + "px";
  }
  function showFn(fn) {
    if (fn.closest(".spoil:not(.open)")) { hideFn(); return; }     // 닫힌 스포일러 안 각주는 내용이 새지 않게
    var src = fn.querySelector(":scope > span"); if (!src) return;
    clearTimeout(hideT);
    if (!ftip) {
      ftip = document.createElement("div"); ftip.className = "fn-tip"; document.body.appendChild(ftip);
      ftip.addEventListener("mouseenter", function () { clearTimeout(hideT); });
      ftip.addEventListener("mouseleave", schedHide);
      ftip.addEventListener("click", function (e) {                 // 캐릭터 링크는 원본에 전달해서 기존 동작 그대로
        var a = e.target.closest && e.target.closest("a.ch-link[data-ch]");
        if (!a || !ftip.__src) return;
        var idx = [].indexOf.call(ftip.querySelectorAll("a.ch-link[data-ch]"), a);
        var orig = ftip.__src.querySelectorAll("a.ch-link[data-ch]")[idx];
        if (orig) { e.preventDefault(); passing = true; try { orig.click(); } finally { passing = false; } hideFn(); }
      });
    }
    if (curFn !== fn) {
      ftip.innerHTML = src.innerHTML; ftip.__src = src; curFn = fn;
      [].forEach.call(ftip.querySelectorAll("[onclick]"), function (n) { n.removeAttribute("onclick"); });
    }
    placeFn(fn);
    ftip.classList.add("on");
  }

  document.addEventListener("mouseover", function (e) {
    var t = e.target; if (!t || !t.closest) return;
    /* 각주 */
    var f = t.closest(".fn");
    if (f) showFn(f);
    else if (t.closest(".fn-tip")) clearTimeout(hideT);
    else if (curFn) schedHide();
    /* 스포일러 링크 안내 */
    var a = t.closest("a[href], a[data-ch]"), sp = null;
    if (a && !t.closest(".fn-tip")) {
      var p = t.closest(".spoil");
      if (!p && a.querySelector(".spoil")) p = a.querySelector(".spoil");
      if (p && (p.contains(a) || a.contains(p)) && p.classList.contains("open")) sp = p;
    }
    if (sp) { if (!tip || tip.__a !== a) showTip(sp, a); } else hideTip();
  });
  document.addEventListener("mouseout", function (e) { if (!e.relatedTarget) { hideTip(); if (curFn) schedHide(); } });
  document.addEventListener("focusin", function (e) { var f = e.target.closest && e.target.closest(".fn"); if (f) showFn(f); });
  document.addEventListener("focusout", function (e) { if (e.target.closest && e.target.closest(".fn")) schedHide(); });
  window.addEventListener("hashchange", function () { hideFn(); hideTip(); });

  /* ----- 더블클릭으로 글자가 선택되는 것 막기 ----- */
  document.addEventListener("mousedown", function (e) {
    var t = e.target;
    if (e.detail > 1 && t && t.closest && t.closest(".spoil") && !t.closest(".fn")) e.preventDefault();
  }, true);

  /* ----- 클릭 처리 ----- */
  document.addEventListener("click", function (e) {
    if (passing) return;
    var t = e.target;
    if (t && t.nodeType !== 1) t = t.parentElement;
    if (!t || !t.closest) return;
    if (t.closest(".fn-tip")) return;                  // 각주 팝업 안 스포일러는 호버로 보여요 (클릭으로 토글 안 함)
    var rtEl = t.closest("rt");                        // 요미가나(rt)를 눌러도 같은 ruby 의 스포일러를 누른 것처럼
    if (rtEl && !t.closest(".spoil") && rtEl.parentElement) {
      var rsp = rtEl.parentElement.querySelector(":scope > .spoil");
      if (rsp) t = rsp;
    }

    var fn = t.closest(".fn");
    var chain = [], p = t.closest(".spoil");           // 안쪽 → 바깥쪽 스포일러
    while (p) { chain.push(p); p = p.parentElement && p.parentElement.closest(".spoil"); }

    if (!chain.length) {                               // 토글 제목 안의 각주 마커: 토글이 같이 접히지 않게
      if (fn && fn.closest("summary") && !t.closest("a")) e.preventDefault();
      return;
    }

    var now = Date.now(), hidden = null, i;
    for (i = chain.length - 1; i >= 0; i--) {          // 가장 바깥의 닫힌 스포일러부터 열어요
      if (!chain[i].classList.contains("open")) { hidden = chain[i]; break; }
    }

    /* 1) 닫혀 있으면: 한 번 클릭 = 열기 (링크 이동 · 상위 클릭 동작 모두 막음) */
    if (hidden) {
      e.preventDefault(); e.stopPropagation();
      hidden.classList.add("open");
      hidden.__openedAt = now;
      // 아주 느린 더블클릭: 첫 클릭이 닫아버린 직후 두 번째 클릭이 온 경우 → 링크 열기
      if (e.detail >= 2 && hidden.__closedAt && now - hidden.__closedAt < 700) {
        var a0 = linkAt(hidden, t); if (a0) fire(a0);
      }
      afterChange();
      return;
    }

    /* 2) 모두 열려 있으면 가장 안쪽 스포일러를 기준으로 */
    var inner = chain[0];
    if (inner.contains(fn)) {                          // 스포일러 안 각주(마커 · 팝업)를 누른 것 → 스포일러는 그대로
      if (fn.closest("summary") && !t.closest("a")) e.preventDefault();
      return;
    }
    e.stopPropagation();
    e.preventDefault();
    if (now - (inner.__openedAt || 0) < 350) return;   // 방금 열린 직후의 두 번째 클릭은 무시

    var a = linkAt(inner, t);
    if (a) {                                           // 링크 스포일러: 클릭 = 닫기, 더블클릭 = 링크 열기
      clearTimeout(inner.__t);
      if (e.detail >= 2) { inner.__t = 0; fire(a); return; }
      inner.__t = setTimeout(function () {
        inner.__t = 0;
        inner.classList.remove("open");
        inner.__closedAt = Date.now();
        afterChange();
      }, 300);
    } else {                                           // 일반 스포일러: 클릭 = 닫기
      inner.classList.remove("open");
      inner.__closedAt = now;
      afterChange();
    }
  }, true);

  document.addEventListener("scroll", function (e) {
    if (ftip && e.target && ftip.contains && ftip.contains(e.target)) return;
    hideTip(); if (curFn) hideFn();
  }, true);
  window.addEventListener("resize", function () { hideTip(); hideFn(); });

  /* ----- 요미가나 묶음: 글자 쪽 스포일러와 rt 안 스포일러가 항상 같이 열리고 닫히게 ----- */
  function rubyOf(sp) {
    var ru = sp.parentElement && sp.parentElement.tagName === "RUBY" ? sp.parentElement : null;
    if (!ru) { var rt = sp.closest("rt"); ru = rt && rt.parentElement && rt.parentElement.tagName === "RUBY" ? rt.parentElement : null; }
    return ru;
  }
  /* ----- 프로필 항목: 제목(dt)과 내용(dd) 둘 다 스포일러가 있으면 같이 열리고 닫히게 ----- */
  function rowGroup(sp) {
    var row = sp.closest(".dt-row"); if (!row) return null;
    var dt = row.querySelector(":scope > dt"), dd = row.querySelector(":scope > dd");
    if (!dt || !dd || !dt.querySelector(".spoil") || !dd.querySelector(".spoil")) return null;
    return [].filter.call(row.querySelectorAll(".spoil"), function (x) { return !x.closest(".fn"); });
  }
  function syncTo(group, sp, on) {
    group.forEach(function (o) {
      if (o !== sp && o.classList.contains("open") !== on) o.classList.toggle("open", on);
    });
  }
  new MutationObserver(function (list) {
    list.forEach(function (m) {
      var sp = m.target;
      if (!sp.classList || !sp.classList.contains("spoil") || sp.closest(".fn-tip") || sp.closest(".fn")) return;
      var on = sp.classList.contains("open");
      var ru = rubyOf(sp);
      if (ru) syncTo(ru.querySelectorAll(":scope > .spoil, :scope > rt .spoil"), sp, on);
      var g = rowGroup(sp);
      if (g) syncTo(g, sp, on);
    });
  }).observe(document.body, { subtree: true, attributes: true, attributeFilter: ["class"] });
})();
</script>
